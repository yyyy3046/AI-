/* ---------------- 知识点掌握度雷达图（纯 SVG，零依赖） ---------------- */

/**
 * 纯 SVG 雷达图：呈现各知识点掌握度强弱，一眼看出薄弱环节。
 * @param {Array<{title:string, rate:number, tested?:boolean}>} items - rate 为 0-100 的掌握率；tested:false 表示暂无作答（落到中心，标签显示「未测」，不臆造掌握率）
 * @param {{size?:number}} [opts]
 * @returns {string} SVG 字符串；知识点不足 3 个时返回空串（调用方自行回退到条形列表）
 */
function radarChartSvg(items, opts) {
  opts = opts || {};
  const size = opts.size || 320;
  const cx = size / 2;
  const cy = size / 2;
  const radius = size / 2 - 56; // 外圈留给标签
  const n = (items || []).length;
  if (n < 3) return '';

  const clamp = v => Math.max(0, Math.min(100, Number(v) || 0));
  const angle = i => (Math.PI * 2 * i) / n - Math.PI / 2; // 从正上方起顺时针
  const pt = (i, ratio) => {
    const a = angle(i);
    return [cx + Math.cos(a) * radius * ratio, cy + Math.sin(a) * radius * ratio];
  };
  const fmt = v => (Math.round(v * 10) / 10).toFixed(1);

  const rings = [20, 40, 60, 80, 100];
  const gridPolys = rings.map(r => {
    const pts = items.map((_, i) => {
      const [x, y] = pt(i, r / 100);
      return `${fmt(x)},${fmt(y)}`;
    }).join(' ');
    return `<polygon points="${pts}" class="radar-grid" />`;
  }).join('');

  const ringLabels = rings.map(r => {
    const y = cy - radius * (r / 100);
    return `<text x="${fmt(cx - 6)}" y="${fmt(y + 3)}" text-anchor="end" class="radar-ring-label">${r}</text>`;
  }).join('');

  const axes = items.map((_, i) => {
    const [x, y] = pt(i, 1);
    return `<line x1="${fmt(cx)}" y1="${fmt(cy)}" x2="${fmt(x)}" y2="${fmt(y)}" class="radar-axis" />`;
  }).join('');

  const dataPts = items.map((it, i) => {
    const [x, y] = pt(i, clamp(it.rate) / 100);
    return `${fmt(x)},${fmt(y)}`;
  }).join(' ');

  const dots = items.map((it, i) => {
    if (it.tested === false) return ''; // 未测点落在中心，不重复绘制顶点
    const [x, y] = pt(i, clamp(it.rate) / 100);
    const tone = it.rate < 50 ? 'weak' : (it.rate < 75 ? 'mid' : 'strong');
    return `<circle cx="${fmt(x)}" cy="${fmt(y)}" r="3.5" class="radar-dot ${tone}" />`;
  }).join('');

  const labels = items.map((it, i) => {
    const [x, y] = pt(i, 1.22);
    const anchor = Math.abs(x - cx) < 5 ? 'middle' : (x > cx ? 'start' : 'end');
    const untested = it.tested === false;
    const tone = untested ? 'untested' : (it.rate < 50 ? 'weak' : (it.rate < 75 ? 'mid' : 'strong'));
    const val = untested ? '未测' : `${clamp(it.rate)}%`;
    return `<text x="${fmt(x)}" y="${fmt(y)}" text-anchor="${anchor}" dominant-baseline="middle" class="radar-label ${tone}">${esc(it.title)} · ${val}</text>`;
  }).join('');

  return `<svg class="radar-chart" viewBox="0 0 ${size} ${size}" width="100%" height="${size}" role="img" aria-label="知识点掌握度雷达图">${gridPolys}${ringLabels}${axes}<polygon points="${dataPts}" class="radar-data" />${dots}${labels}</svg>`;
}

/* ---------------- 手写公式识别结果 + 逐步比对（学生/教师共用） ---------------- */

const STEP_VERDICT_META = {
  match: { label: '✓ 等价', cls: 'success' },
  partial: { label: '≈ 部分', cls: 'warning' },
  wrong: { label: '✗ 错误', cls: 'danger' },
  missing: { label: '— 缺失', cls: 'outline' }
};

/**
 * 渲染「手写识别 LaTeX + 逐步比对」两张卡片；无相关数据时返回空串。
 * @param {object} review - 判分结果（含 latex / stepCompare）
 */
function latexReviewHtml(review) {
  if (!review) return '';
  const latex = review.latex;
  const cmp = Array.isArray(review.stepCompare) ? review.stepCompare : [];
  if (!latex && !cmp.length) return '';

  let html = '';
  if (latex && Array.isArray(latex.steps) && latex.steps.length) {
    const conf = Number(latex.confidence) || 0;
    const confCls = conf >= 0.8 ? 'success' : conf >= 0.5 ? 'warning' : 'danger';
    const rows = latex.steps.map((s, i) => `
      <div class="latex-step">
        <span class="latex-idx">${i + 1}</span>
        <code class="latex-code">${esc(s.latex)}</code>
        ${s.note ? `<span class="latex-note">${esc(s.note)}</span>` : ''}
      </div>`).join('');
    html += `
    <div class="review-card ai">
      <div class="review-head">
        <b>🔍 手写公式识别 · LaTeX</b>
        ${conf ? `<span class="badge ${confCls}">置信度 ${Math.round(conf * 100)}%</span>` : ''}
      </div>
      <div class="latex-steps">${rows}</div>
      ${latex.finalAnswer ? `<div class="latex-final">最终答案：<code class="latex-code">${esc(latex.finalAnswer)}</code></div>` : ''}
    </div>`;
  }

  if (cmp.length) {
    const tally = { match: 0, partial: 0, wrong: 0, missing: 0 };
    cmp.forEach(r => { if (tally[r.verdict] !== undefined) tally[r.verdict]++; });
    const rows = cmp.map((r, i) => {
      const meta = STEP_VERDICT_META[r.verdict] || STEP_VERDICT_META.partial;
      return `
      <div class="sc-row">
        <span class="sc-idx">${i + 1}</span>
        <span class="sc-mine">${r.student ? `<code class="latex-code">${esc(r.student)}</code>` : '<span class="sc-empty">（未写）</span>'}</span>
        <span class="sc-expect">${esc(r.expected || '—')}</span>
        <span class="sc-verdict"><span class="badge ${meta.cls}">${meta.label}</span></span>
        <span class="sc-note">${esc(r.note || '')}</span>
      </div>`;
    }).join('');
    const tallyHtml = [
      `<span class="badge success">等价 ${tally.match}</span>`,
      `<span class="badge warning">部分 ${tally.partial}</span>`,
      `<span class="badge danger">错误 ${tally.wrong}</span>`,
      `<span class="badge outline">缺失 ${tally.missing}</span>`
    ].join(' ');
    html += `
    <div class="review-card">
      <div class="review-head"><b>🧮 逐步比对</b><span class="sc-tally">${tallyHtml}</span></div>
      <div class="step-compare">
        <div class="sc-row sc-head">
          <span class="sc-idx">#</span>
          <span class="sc-mine">我的步骤</span>
          <span class="sc-expect">标准步骤</span>
          <span class="sc-verdict">判定</span>
          <span class="sc-note">说明</span>
        </div>
        ${rows}
      </div>
    </div>`;
  }

  return html;
}

/** 教师课件预览弹窗：与学生端共用幻灯片渲染 */
function teacherPptModal(activePage) {
  if (!activePage) return '';
  const pages = coursewarePages();
  if (!pages.length) return '';
  const total = db.courseware.pages || pages[pages.length - 1].page;
  const current = pages.find(item => item.page === Number(activePage)) || pages[0];
  const index = pages.indexOf(current);
  const prev = pages[index - 1];
  const next = pages[index + 1];

  return `
  <div class="modal-mask">
    <div class="modal teacher-ppt-modal">
      <div class="drawer-head">
        <div>
          <h3>课件预览</h3>
          <div class="sub">${esc(db.courseware.fileName)} · 第 ${current.page} 页 / 共 ${total} 页 · 仅教师可见</div>
        </div>
        <button class="close-btn" data-act="close-teacher-ppt">×</button>
      </div>
      <div class="card-body">
        <div class="ppt-pages" style="flex-direction:row;overflow-x:auto;max-height:none;margin-bottom:12px">
          ${pages.map(item => `
            <button class="ppt-page-chip ${item.page === current.page ? 'active' : ''}" data-act="teacher-ppt-page" data-page="${item.page}">
              <b>${item.page}</b><span>${esc(item.points[0].title)}</span>
            </button>`).join('')}
        </div>
        <div class="ppt-stage">${pptSlideHtml(current, total)}</div>
        <div class="ppt-nav">
          <button class="btn btn-sm" data-act="teacher-ppt-page" data-page="${prev ? prev.page : ''}" ${prev ? '' : 'disabled'}>← 上一页</button>
          <span class="ppt-nav-hint">第 ${current.page} 页 · 已标注 ${index + 1}/${pages.length}</span>
          <button class="btn btn-sm" data-act="teacher-ppt-page" data-page="${next ? next.page : ''}" ${next ? '' : 'disabled'}>下一页 →</button>
        </div>
      </div>
    </div>
  </div>`;
}

function reviewView() {

  const pendingCount = submissions.filter(s => s.status !== 'reviewed').length;

    .filter(s => filter === 'all' ? true : filter === 'pending' ? s.status !== 'reviewed' : s.status === 'reviewed')
    .sort((a, b) => {
      const p = (a.status !== 'reviewed' ? 0 : 1) - (b.status !== 'reviewed' ? 0 : 1);

function liveView() {
  const quizzes = db.assignments.filter(a => a.mode === 'quiz');
  const subsAll = db.submissions.filter(s => s.courseId === db.courseId && s.classId === teacherClassId());
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });

  const cards = quizzes.map(a => {
    const subs = subsAll.filter(s => s.assignmentId === a.id);
    const rows = a.questionIds.map((qid, index) => {
      const q = Q(qid);
      const values = subs.map(s => s.answers[qid]).filter(v => answerHasContent(v));
      const total = values.length;
      const withPhoto = values.filter(v => answerImages(v).length).length;
      const letter = q.type === 'single' ? String.fromCharCode(65 + q.answer) : '—';
      const correct = q.type === 'single' ? values.filter(v => Number(answerText(v)) === q.answer).length : 0;
      const rate = total ? Math.round((correct / total) * 100) : 0;
      const dist = q.type === 'single' ? q.options.map((opt, i) => {
        const n = values.filter(v => Number(answerText(v)) === i).length;
        const pct = total ? Math.round((n / total) * 100) : 0;
        return `<div class="dist-row">
          <span class="dist-key ${i === q.answer ? 'ok' : ''}">${String.fromCharCode(65 + i)}</span>
          <div class="dist-bar"><i class="${i === q.answer ? 'ok' : ''}" style="width:${pct}%"></i></div>
          <span class="dist-val">${n} 人</span>
        </div>`;
      }).join('') : '';

      return `
      <div class="live-q">
        <div class="live-q-head">
          <div style="min-width:0">
            <div class="q-stem">Q${index + 1} ${esc(q.stem)}</div>
            <div class="q-meta">
              <span>${total} 人作答</span><span>·</span>
              <span>答对 ${correct} 人</span><span>·</span>
              <span>正确答案 ${letter}</span><span>·</span>
              <span>课件第 ${P(q.knowledgeId)?.page} 页</span>${withPhoto ? `<span>·</span><span>📷 附照片 ${withPhoto} 人</span>` : ''}
            </div>
          </div>
          <div class="live-rate ${rate >= 60 ? 'ok' : 'low'}"><b>${rate}%</b><small>正答率</small></div>
        </div>
        ${dist ? `<div class="dist">${dist}</div>` : ''}
      </div>`;
    }).join('');

    return `
    <div class="card">
      <div class="card-head">
        <div><h2>${esc(a.title)}</h2><div class="sub">${a.questionIds.length} 题 · 满分 ${totalScore(a.questionIds)} 分</div></div>
        <span class="badge brand">${subs.length} 人已提交</span>
      </div>
      <div class="card-body">${rows}</div>
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <h1>课上问答 · 实时正答率</h1>
      <p>学生在课堂提交后，正答率与选项分布会随页面刷新同步更新</p>
    </div>
    <span class="badge success">🔄 每 4 秒自动刷新</span>
  </div>
  ${cards || '<div class="empty"><b>还没有课堂题目</b>去课件工坊把题目发布为课堂问答</div>'}
  <div class="privacy-note" style="margin-top:12px"><span>⏱</span><div>页面更新于 ${time}，数据来自本课程学生提交记录。</div></div>`;
}

function analyticsView() {
  const data = analyticsData();

  const radarItems = data.radarItems || [];
  const masteryBarsHtml = radarItems.map(row => {
    if (row.tested === false) {
      return `
      <div class="bar-row untested">
        <span>${esc(row.title)}</span>
        <span class="bar-track"><span class="bar-fill untested" style="width:0%"></span></span>
        <span class="val">未测</span>
      </div>`;
    }
    const cls = row.rate < 50 ? 'verylow' : row.rate < 75 ? 'low' : '';
    return `
      <div class="bar-row">
        <span>${esc(row.title)}</span>
        <span class="bar-track"><span class="bar-fill ${cls}" style="width:${row.rate}%"></span></span>
        <span class="val">${row.rate}%</span>
      </div>`;
  }).join('');

  const weakCount = radarItems.filter(r => r.tested && r.rate < 50).length;
  const midCount = radarItems.filter(r => r.tested && r.rate >= 50 && r.rate < 75).length;
  const strongCount = radarItems.filter(r => r.tested && r.rate >= 75).length;
  const untestedCount = radarItems.filter(r => r.tested === false).length;
  const testedCount = radarItems.length - untestedCount;
  let masteryCardBody;
  if (!radarItems.length) {
    masteryCardBody = '<div class="empty">暂无知识点数据</div>';

function examView() {
  const papers = (db.examPapers || []).filter(p => p.classId === teacherClassId());
  const active = ui.activeExamId ? papers.find(p => p.id === ui.activeExamId) : null;
  const gen = ui.examGen;

  const stepsHtml = EXAM_STEPS.map((label, i) => {
    let cls = '';
    let mark = '';
    if (gen) {
      if (i < gen.step) { cls = 'done'; mark = '✓'; }
      else if (i === gen.step) { cls = 'active'; mark = '·'; }
    } else {
      cls = 'done';
      mark = '✓';
    }
    return `<div class="gen-step ${cls}"><span class="dot">${mark}</span>${esc(label)}</div>`;
  }).join('');

  const cardsHtml = papers.map(paper => {
    const score = paper.items.reduce((sum, item) => sum + item.score, 0);
    const max = paper.items.reduce((sum, item) => sum + item.max, 0);
    const rate = max ? Math.round((score / max) * 100) : 0;
    return `
    <div class="card exam-paper ${active && active.id === paper.id ? 'active' : ''}" data-act="open-exam" data-id="${paper.id}">
      <div class="card-head">
        <div>
          <h2>${esc(paper.title)}</h2>
          <div class="sub">${esc(paper.fileName)} · ${esc(paper.uploadedAt)}</div>
        </div>
        <span class="badge ${paper.status === 'confirmed' ? 'success' : 'warning'}">${paper.status === 'confirmed' ? '已确认' : '待批注'}</span>
      </div>
      <div class="card-body">
        <div class="q-meta"><span>${esc(paper.studentName)}</span><span>·</span><span>${paper.items.length} 题</span><span>·</span><span>满分 ${max}</span></div>
        <div class="exam-score-line"><b>${score}</b><small>/ ${max}</small><span>得分率 ${rate}%</span></div>
        <div class="exam-hint">${paper.status === 'confirmed' ? '教师已确认批注，可投屏讲评' : 'AI 已逐题批注，等待教师核对'}</div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="notice">
    <span>🗂</span>
    <div><b>老师可上传整份试卷，AI 自动切题并逐题批注。</b>批注保留课件页码与原文，教师核对确认后才发布讲评。</div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head">
      <div><h2>上传整套试卷</h2><div class="sub">支持 PDF、图片、Word，AI 自动识别题号与知识点</div></div>
      ${gen ? '<span class="badge ai">AI 批注中</span>' : '<span class="badge">AI 生成</span>'}
    </div>
    <div class="card-body">
      <div class="upload-zone" data-act="open-exam-upload">
        <div class="upload-ico">PDF</div>
        <div class="upload-text">
          <b>点击上传整份试卷</b>
          <span>系统将自动识别版面、切分题目，并对照课件生成分数与批注</span>
        </div>
      </div>
      <input type="file" id="exam-input" accept=".pdf,.png,.jpg,.jpeg,.docx" style="display:none">
      <div class="gen-steps" style="margin-top:14px">${stepsHtml}</div>
    </div>
  </div>

  ${papers.length ? `<div class="grid-2" style="margin-bottom:16px">${cardsHtml}</div>` : '<div class="empty" style="margin-bottom:16px"><b>还没有上传试卷</b>上传后 AI 会给出一份逐题批注</div>'}

  ${examWrongSummary()}

  ${active ? examDetail(active) : `
  <div class="card">
    <div class="empty"><b>选择一份试卷</b>查看 AI 逐题批注，核对分数后发布讲评</div>
  </div>`}`;
}

function examDetail(paper) {
  const score = paper.items.reduce((sum, item) => sum + item.score, 0);
  const max = paper.items.reduce((sum, item) => sum + item.max, 0);
  const rate = max ? Math.round((score / max) * 100) : 0;
  const pending = paper.status !== 'confirmed';
  const wrongCount = paper.items.filter(item => item.score < item.max).length;

  const itemsHtml = paper.items.map(item => {
    const point = P(item.knowledgeId);
    const cls = item.score === item.max ? 'success' : item.score === 0 ? 'danger' : 'warning';
    const typeLabel = item.type === 'single' ? '选择题' : item.type === 'fill' ? '填空题' : (item.comprehensive ? '综合题' : '简答题');
    const autoLabel = item.type === 'single' ? '自动判分' : item.type === 'fill' ? '采分点判分' : 'AI 初评';
    const optionsHtml = item.type === 'single' && item.options
      ? `<div class="exam-options">${item.options.map((opt, i) => {
          const key = String.fromCharCode(65 + i);
          const ok = key === item.correctAnswer;
          const picked = key === item.studentAnswer;
          return `<span class="exam-opt ${ok ? 'ok' : ''} ${picked ? 'picked' : ''}">${key}. ${esc(opt)}</span>`;
        }).join('')}</div>`
      : '';

    return `
    <div class="exam-item">
      <div class="exam-item-head">
        <span class="q-no">第 ${item.no} 题</span>
        <span class="exam-type">${typeLabel}</span>
        <span class="badge ${cls}">${item.score} / ${item.max} 分</span>
        <span class="exam-auto">${autoLabel}</span>
        <span class="exam-point">「${esc(point?.title || '')}」· 第 ${item.page} 页</span>
      </div>
      <div class="exam-stem">${esc(item.stem)}</div>
      ${optionsHtml}
      <div class="exam-answers">
        <div class="exam-ans"><b>学生作答</b><span class="${item.score === item.max ? 'ok' : 'bad'} ${item.type === 'fill' ? 'fill' : ''}">${esc(item.studentAnswer)}</span></div>
        <div class="exam-ans"><b>参考答案</b><span class="${item.type === 'fill' ? 'fill ok' : ''}">${esc(item.correctAnswer)}</span></div>
      </div>
      <div class="review-card ai">
        <div class="review-head"><b>🤖 AI 批注</b><span class="badge ai">建议 ${item.score} 分</span></div>
        <div class="review-text">${esc(item.aiComment)}</div>
        <div class="exam-cite">课件原文 · 第 ${item.page} 页：“${esc(point?.excerpt || '')}”</div>
        ${item.type === 'fill' ? `<div class="exam-points">采分点：公式主体 3 分 · 适用条件与符号 3 分</div>` : ''}
      </div>
      ${pending ? `
        <div class="exam-edit">
          <div class="field" style="margin-bottom:0;max-width:150px">
            <label>教师核定分数</label>
            <input class="input" type="number" min="0" max="${item.max}" value="${item.score}" data-exam-score="${item.no}">
          </div>
          <div class="field" style="margin-bottom:0;flex:1">
            <label>教师补充批注</label>
            <input class="input" value="${esc(item.teacherComment || '')}" placeholder="可留空，沿用 AI 批注" data-exam-comment="${item.no}">
          </div>
        </div>` : (item.teacherComment ? `
        <div class="review-card teacher">
          <div class="review-head"><b>教师补充批注</b></div>
          <div class="review-text">${esc(item.teacherComment)}</div>
        </div>` : '')}
    </div>`;
  }).join('');

  return `
  <div class="card" id="exam-detail">
    <div class="card-head">
      <div>
        <h2>${esc(paper.title)} · 逐题批注</h2>
        <div class="sub">${esc(paper.studentName)} · ${paper.items.length} 题 · 上传于 ${esc(paper.uploadedAt)}</div>
      </div>
      <span class="badge ${pending ? 'warning' : 'success'}">${pending ? '待教师核对' : '已确认 · ' + esc(paper.confirmedAt || '')}</span>
    </div>
    <div class="card-body">
      <div class="exam-summary">
        <div class="metric"><div class="label">整卷得分</div><div class="value">${score}<small>/ ${max}</small></div><div class="delta">得分率 ${rate}%</div></div>
        <div class="metric"><div class="label">失分题数</div><div class="value">${wrongCount}</div><div class="delta">共 ${paper.items.length} 题</div></div>
        <div class="metric"><div class="label">AI 批注</div><div class="value">${paper.items.length}<small> 条</small></div><div class="delta">每条均带课件页码</div></div>
      </div>

      ${pending ? `
      <div class="batch-bar">
        <div class="batch-title">
          <b>批量批改客观题</b>
          <span>选择题 ${paper.items.filter(i => i.type === 'single').length} 题 · 填空题 ${paper.items.filter(i => i.type === 'fill').length} 题，可先统一处理再逐题微调</span>
        </div>
        <div class="batch-actions">
          <button class="btn btn-sm" data-act="batch-objective" data-mode="adopt">采纳 AI 判分</button>
          <span class="batch-add">
            <input class="input" id="batch-delta" type="number" value="1" step="1" style="width:72px">
            <button class="btn btn-sm" data-act="batch-objective" data-mode="add">统一加减分</button>
          </span>
          <button class="btn btn-sm" data-act="batch-objective" data-mode="full">客观题全部满分</button>
        </div>
      </div>` : ''}

      ${itemsHtml}

      ${pending ? `
      <div class="exam-foot">
        <span>核对后可修改分数与批注，确认后即为最终讲评稿。</span>
        <button class="btn btn-primary" data-act="confirm-exam">确认批注并发布讲评</button>
      </div>` : `
      <div class="exam-foot">
        <span>本卷批注已确认，可作为课堂讲评与个别辅导依据。</span>
        <span class="badge success">已确认</span>
      </div>`}
    </div>
  </div>`;
}

function examWrongSummary() {
  const papers = (db.examPapers || []).filter(p => p.classId === teacherClassId());
  const wrongs = [];
  papers.forEach(paper => {
    paper.items.forEach(item => {
      if (item.type === 'short' || item.score >= item.max) return;
      wrongs.push({ paper, item });
    });
  });

  if (!wrongs.length) {
    return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-head">
        <div><h2>客观题错题汇总</h2><div class="sub">跨试卷汇总选择题与填空题的失分点</div></div>
        <span class="badge success">暂无失分</span>
      </div>
      <div class="card-body"><div class="empty">目前所有客观题均为满分</div></div>
    </div>`;
  }

  const groupMap = {};
  wrongs.forEach(({ paper, item }) => {
    if (!groupMap[item.knowledgeId]) {
      groupMap[item.knowledgeId] = {
        id: item.knowledgeId,
        title: P(item.knowledgeId)?.title || item.knowledgeId,
        page: item.page,
        count: 0,
        items: []
      };
    }
    groupMap[item.knowledgeId].count++;
    groupMap[item.knowledgeId].items.push({ paper, item });
  });
  const groups = Object.values(groupMap).sort((a, b) => b.count - a.count);
  const paperCount = new Set(wrongs.map(w => w.paper.id)).size;

  return `

function analyticsData() {
  const objectiveIds = db.questions.filter(q => q.type === 'single').map(q => q.id);
  const relevantObjectives = objectiveIds.filter(id => db.assignments.some(a => a.questionIds.includes(id)));
  const subs = db.submissions.filter(s => s.courseId === db.courseId && s.classId === teacherClassId());
  const students = new Set(subs.map(s => s.studentId));

  const classSize = Math.max(1, (currentClass() ? currentClass().studentCount : db.course.studentCount) || 0);
  const submitRate = Math.round((students.size / classSize) * 100);

  const rates = subs.map(s => s.total / s.max);
  const avgRate = rates.length ? Math.round((rates.reduce((a, b) => a + b, 0) / rates.length) * 100) : 0;

  let correctCount = 0;
  let objectiveCount = 0;
  const masteryMap = {};
  const errorMap = {};

  subs.forEach(sub => {
    relevantObjectives.forEach(qid => {
      if (sub.scores[qid] === undefined) return;
      const q = Q(qid);
      const correct = sub.scores[qid] === q.score;
      objectiveCount++;
      if (correct) correctCount++;
      if (!masteryMap[q.knowledgeId]) masteryMap[q.knowledgeId] = { total: 0, correct: 0 };
      masteryMap[q.knowledgeId].total++;
      if (correct) masteryMap[q.knowledgeId].correct++;
      if (!correct) errorMap[qid] = (errorMap[qid] || 0) + 1;
    });
  });

  const mastery = Object.entries(masteryMap).map(([kid, v]) => ({
    title: P(kid)?.title || kid,
    rate: Math.round((v.correct / v.total) * 100)
  })).sort((a, b) => a.rate - b.rate);

  /* 雷达图覆盖课程全部知识点：有作答的取实测掌握率，未测的标记 tested:false（不臆造 0%） */
  const pointIds = [...new Set((db.questions || []).map(q => q.knowledgeId).filter(Boolean))];
  const radarItems = pointIds.map(kid => {
    const m = masteryMap[kid];
    const title = P(kid)?.title || kid;
    return m
      ? { title, rate: Math.round((m.correct / m.total) * 100), tested: true }
      : { title, rate: 0, tested: false };
  }).sort((a, b) => {
    if (a.tested !== b.tested) return a.tested ? -1 : 1;
    return a.rate - b.rate;
  });

  const errors = Object.entries(errorMap)
    .map(([qid, count]) => {
      const q = Q(qid);
      const point = P(q.knowledgeId);
      return {
        title: q.stem.length > 26 ? q.stem.slice(0, 26) + '…' : q.stem,
        pointTitle: point?.title || '',
        page: point?.page || 0,
        count
      };
    })
    .sort((a, b) => b.count - a.count)
    .slice(0, 4);

  /* 按知识点聚合本班错题，供下节课讲评 */
  const wrongPointMap = {};
  subs.forEach(sub => {
    relevantObjectives.forEach(qid => {
      if (sub.scores[qid] === undefined) return;
      const q = Q(qid);
      if (sub.scores[qid] === q.score) return;
      const pid = q.knowledgeId;
      if (!wrongPointMap[pid]) {
        wrongPointMap[pid] = {
          id: pid,
          title: P(pid)?.title || pid,
          page: P(pid)?.page || 0,
          wrong: 0,
          stems: [],
          students: {}
        };
      }
      const group = wrongPointMap[pid];
      group.wrong++;
      if (group.stems.length < 2 && !group.stems.includes(q.stem)) group.stems.push(q.stem);
      group.students[sub.studentId] = true;
    });
  });
  const wrongPoints = Object.values(wrongPointMap).map(group => {
    const answered = masteryMap[group.id] ? masteryMap[group.id].total : group.wrong;
    return {
      id: group.id,
      title: group.title,
      page: group.page,
      wrong: group.wrong,
      students: Object.keys(group.students).length,
      rate: answered ? Math.round((group.wrong / answered) * 100) : 0,
      stems: group.stems
    };
  }).sort((a, b) => b.wrong - a.wrong || b.rate - a.rate);

  const recent = [...subs]
    .sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1))
    .slice(0, 6);

  const pendingReview = subs.filter(s => s.status === 'ai_reviewed').length;

  return {
    submitRate,
    submitted: students.size,
    avgRate,
    correctRate: objectiveCount ? Math.round((correctCount / objectiveCount) * 100) : 0,
    correctCount,
    objectiveCount,
    pendingReview,
    mastery,
    radarItems,
    errors,
    wrongPoints,
    recent
  };
}

/* ---------------- 学生 · 知识点自我检测 ---------------- */

/** 对照整门课的知识框架，学生逐个标记「已掌握 / 待复习」并查看进度 */
function selfCheckView() {
  const map = selfCheckOf(db.courseId);
  const filter = ui.selfCheckFilter || 'all';

  /* 展开知识框架：章节 → 小节 → 知识点（过滤掉空章节） */
  const chapters = (db.mindMap || []).map(ch => ({
    title: ch.title,
    sections: (ch.sections || []).map(sec => ({
      title: sec.title,
      points: (sec.points || []).map(P).filter(Boolean)
    })).filter(sec => sec.points.length)
  })).filter(ch => ch.sections.length);

  let total = 0, mastered = 0, review = 0;
  chapters.forEach(ch => ch.sections.forEach(sec => sec.points.forEach(p => {
    total++;
    if (map[p.id] === 'mastered') mastered++;
    else if (map[p.id] === 'review') review++;
  })));
  const unmarked = total - mastered - review;
  const pct = total ? Math.round(mastered * 100 / total) : 0;

  const passFilter = (p) => {
    const cur = map[p.id] || '';
    if (filter === 'mastered') return cur === 'mastered';
    if (filter === 'review') return cur === 'review';
    if (filter === 'unmarked') return !cur;
    return true;
  };

  const chip = (f, label, count) =>
    `<button class="chip-btn ${filter === f ? 'active' : ''}" data-act="self-check-filter" data-filter="${f}">${label} <b>${count}</b></button>`;

  const body = chapters.map(ch => {
    const chPts = ch.sections.reduce((arr, s) => arr.concat(s.points), []);
    const chTotal = chPts.length;
    const chMastered = chPts.filter(p => map[p.id] === 'mastered').length;
    const chPct = chTotal ? Math.round(chMastered * 100 / chTotal) : 0;

    const secHtml = ch.sections.map(sec => {
      const pts = sec.points.filter(passFilter);
      if (!pts.length) return '';
      const rows = pts.map(p => {
        const cur = map[p.id] || '';
        return `
        <div class="sc-row">
          <div class="sc-point">
            <span class="sc-dot ${cur || 'none'}"></span>
            <span class="sc-title">${esc(p.title)}</span>
            ${p.page ? `<span class="badge">教材 P${p.page}</span>` : ''}
          </div>
          <div class="sc-actions">
            <button class="sc-btn ${cur === 'mastered' ? 'on mastered' : ''}" data-act="self-check-set" data-point="${p.id}" data-status="mastered">已掌握</button>
            <button class="sc-btn ${cur === 'review' ? 'on review' : ''}" data-act="self-check-set" data-point="${p.id}" data-status="review">待复习</button>
            <button class="btn btn-sm btn-ghost" data-act="open-point" data-id="${p.id}">查看</button>
          </div>
        </div>`;
      }).join('');
      return `
      <div class="sc-section">
        <div class="sc-section-title">${esc(sec.title)}</div>
        ${rows}
      </div>`;
    }).filter(Boolean).join('');

    if (!secHtml) return '';
    return `
    <div class="sc-chapter">
      <div class="sc-chapter-head">
        <span class="sc-chapter-title">${esc(ch.title)}</span>
        <div class="sc-progress"><div class="sc-progress-bar" style="width:${chPct}%"></div></div>
        <span class="sc-chapter-meta">${chMastered}/${chTotal}</span>
      </div>
      ${secHtml}
    </div>`;
  }).filter(Boolean).join('');

  return `
  <div class="sc-wrap">
    <div class="sc-summary">
      <div class="sc-summary-main">
        <div class="sc-pct">${pct}<small>%</small></div>
        <div>
          <div class="sc-summary-title">自我检测进度</div>
          <div class="sub">${esc(db.course.name)} · 共 ${total} 个知识点</div>
        </div>
      </div>
      <div class="sc-stats">
        <span class="sc-stat"><i class="dot mastered"></i><b>${mastered}</b> 已掌握</span>
        <span class="sc-stat"><i class="dot review"></i><b>${review}</b> 待复习</span>
        <span class="sc-stat"><i class="dot none"></i><b>${unmarked}</b> 未标记</span>
      </div>
    </div>

    <div class="sc-toolbar">
      <div class="sc-filters">
        ${chip('all', '全部', total)}
        ${chip('mastered', '已掌握', mastered)}
        ${chip('review', '待复习', review)}
        ${chip('unmarked', '未标记', unmarked)}
      </div>
      <button class="btn btn-sm btn-ghost" data-act="self-check-reset">清空记录</button>
    </div>

    ${body || '<div class="empty">当前筛选下没有知识点</div>'}
  </div>`;
}

/* ---------------- 课件 PPT 预览 ---------------- */

/** 课件中有知识点标注的页码，按页码升序 */
function coursewarePages() {
  const map = {};
  db.points.forEach(point => {
    if (!point.page) return;
    (map[point.page] = map[point.page] || []).push(point);
  });
  return Object.keys(map)
    .map(Number)
    .sort((a, b) => a - b)
    .map(page => ({ page, points: map[page] }));
}

/** 按章节/小节聚合有知识点标注的页码 */
function sectionsWithPages() {
  return db.mindMap.map(chapter => ({
    chapter,
    sections: chapter.sections.map(section => {
      const points = section.points.map(P).filter(Boolean).sort((a, b) => a.page - b.page);
      const pages = [...new Set(points.map(point => point.page))];
      return { section, points, pages };
    }).filter(item => item.points.length)
  })).filter(item => item.sections.length);
}

/** 单页幻灯片，学生端与教师预览共用 */
function pptSlideHtml(pageData, total) {
  const main = pageData.points[0];

      <span>${esc(db.course.name)} · ${esc(db.course.code)}</span>
      <span>第 ${pageData.page} 页 / 共 ${total} 页</span>
    </div>
    <h2>${esc(main.title)}</h2>
    <p class="ppt-summary">${esc(main.summary || '')}</p>
    ${main.formulas && main.formulas.length ? `
      <div class="ppt-formulas">${main.formulas.map(f => `<div>${esc(f)}</div>`).join('')}</div>` : ''}
    ${more.length ? `
      <div class="ppt-more">
        <div class="ppt-more-title">本页还包含</div>
        ${more.map(point => `<button class="chip-btn" data-act="open-point" data-id="${point.id}">${esc(point.title)}</button>`).join('')}
      </div>` : ''}
    <div class="ppt-slide-foot">
      <span>${esc(main.excerpt || '')}</span>
      <button class="btn btn-sm btn-ghost" data-act="open-point" data-id="${main.id}">在导图中查看 →</button>

}

function coursewareView() {

/* AI 问答 · 按作业题问答模式 */
function renderAiHomeQuestion(tabs) {
  const questions = db.questions || [];

  if (!ui.aiHomeQuestionId && selId) ui.aiHomeQuestionId = selId;

  const chats = q ? (ui.aiChats[q.id] || []) : [];
  const submitted = db.session.role === 'teacher' || !!mySubmission(assignmentOfQuestion(q?.id || '')?.id || '');

  const qOptions = questions.map(item => {
    const a = assignmentOfQuestion(item.id);
    const prefix = a ? a.title + ' · ' : '';
    const stem = (item.stem || '').replace(/\s+/g, ' ');
    const label = (prefix + stem).slice(0, 34);
    return `<option value="${item.id}" ${item.id === selId ? 'selected' : ''}>${esc(label)}${(prefix + stem).length > 34 ? '…' : ''}</option>`;
  }).join('');

  const bubbles = chats.map(c => {
    const pending = !!c.pending;

    if (c.role === 'me') {
      return `<div class="chat-msg user"><div class="chat-bubble">${text}</div></div>`;
    }
    return `
    <div class="chat-msg bot">
      <span class="chat-avatar">AI</span>
      <div class="chat-bubble">
        ${text}
        ${!pending && point ? `<button class="cite-chip" data-act="open-courseware" data-page="${point.page}">查看教材第 ${point.page} 页 →</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <h1>AI 问答</h1>
      <p>选择一道作业题，AI 助教只依据本课程课件给提示与讲解；提交后可查看完整解析</p>

    <span class="badge ai">作业题答疑</span>
  </div>
  ${tabs}

  <div class="ai-context">
    <div class="ai-context-main">
      <span class="badge ai">当前题目</span>
      <div><b>${esc(assignmentOfQuestion(q.id)?.title || '作业题')}</b><span>关联「${esc(point?.title || '')}」· 教材第 ${point?.page} 页</span></div>

  <div class="card chat-card">
    <div class="chat-q-actions">
      <button class="btn btn-sm" data-act="ai-home-hint" data-level="0">给我一点提示</button>

      ${chats.length ? bubbles : `

/* 某门课真题库覆盖的知识点（用于自主练习筛选） */
function practiceCoursePoints(courseId) {
  const eq = (db.courses[courseId] && db.courses[courseId].examQuestions) || [];
  const ids = [];
  eq.forEach(q => { if (q.knowledgeId && !ids.includes(q.knowledgeId)) ids.push(q.knowledgeId); });
  return ids.map(id => P(id)).filter(Boolean);
}

          </div>
          ${!ready ? '<div class="form-hint" style="margin-top:10px">AI 出题需先在右上角「模型」配置可用的大模型；未配置时可先用真题库练习。</div>' : ''}

      <div class="card-body">${historyHtml}</div>

  </div>`;
}

function practicePlayView() {
  const paper = ui.practice;
  if (!paper || !paper.questions) {
    return `<div class="empty">没有进行中的练习<div class="q-actions" style="justify-content:center;margin-top:12px"><a class="btn btn-sm" href="#/student/practice-self">去组卷</a></div></div>`;
  }
  const courseName = (db.courses[paper.courseId] && db.courses[paper.courseId].course.name) || paper.courseId;
  const sources = [...new Set(paper.questions.map(q => q.source || '真题'))];
  const sourceLabel = sources.length > 1 ? '混合' : (sources[0] || '真题');
  const isHistory = !!paper.historyId;
  const qs = paper.questions;
  const totalMax = qs.reduce((s, q) => s + q.score, 0);

  const head = `
    <div class="page-head">
      <div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <button class="btn btn-sm btn-ghost" data-act="exit-practice">← 返回</button>
          <span class="badge brand">自主练习</span>
          <span class="badge">${sourceLabel}</span>
        </div>
        <h1>${esc(courseName)} · ${isHistory ? '练习回顾' : '练习作答'}</h1>
        <p>${qs.length} 题 · 满分 ${totalMax} 分${isHistory ? ` · 完成于 ${esc(paper.at || '')}` : ''}</p>
      </div>
      ${paper.result ? `<span class="badge ${paper.result.total >= paper.result.max * 0.6 ? 'success' : 'warning'}">得分 ${paper.result.total} / ${paper.result.max}</span>` : ''}
    </div>`;

  if (paper.result) {
    const list = qs.map((q, index) => {
      const item = (paper.result.items || []).find(it => it.qid === q.id) || { score: 0, max: q.score };
      const value = paper.answers[q.id];
      const correct = item.score === q.score;
      const point = P(q.knowledgeId);
      let body;
      if (q.type === 'single') {
        const opts = (q.options || []).map((opt, i) => {
          let cls = '';
          if (i === q.answer) cls = 'correct';
          else if (i === pickedIndex(value)) cls = 'wrong';
          return `<div class="option ${cls}"><span class="key">${String.fromCharCode(65 + i)}</span><span>${esc(opt)}</span></div>`;
        }).join('');
        body = `${opts}
          <div class="review-card" style="background:var(--surface-2)">
            <div class="review-head"><b>我的答案</b></div>
            <div class="review-text">${singleAnswerLineHtml(value, q.answer)}</div>
          </div>`;
      } else {
        const review = item.review;
        body = `
          <div class="review-card" style="background:var(--surface-2)">
            <div class="review-head"><b>我的答案</b></div>
            <div class="review-text">${answerDisplayHtml(value)}</div>
          </div>
          <div class="review-card">
            <div class="review-head"><b>✅ 标准答案</b>${point ? `<span class="badge outline">课件第 ${point.page} 页</span>` : ''}</div>
            <div class="review-text">${esc(q.reference || '').replace(/\n/g, '<br>')}</div>
          </div>
          ${review ? `
          <div class="review-card ai">
            <div class="review-head"><b>🤖 AI 初评</b><span class="badge ai">${review.score} 分</span>${review.usedLLM ? '<span class="badge" style="margin-left:6px;background:#eef2ff;color:#4f46e5">AI 生成 · 仅供参考</span>' : ''}${review.usedVision ? '<span class="badge" style="margin-left:6px;background:#fff7ed;color:#c2410c">已识别手写照片</span>' : ''}</div>
            <div class="review-text">${esc(review.comment).replace(/\n/g, '<br>')}</div>
            ${point ? `<button class="btn btn-sm btn-ghost" style="margin-top:8px" data-act="open-point" data-id="${q.knowledgeId}">📖 查看课件第 ${point.page} 页原文</button>` : ''}
          </div>
          ${latexReviewHtml(review)}` : ''}`;
      }
      return `
      <div class="q-card">
        <div class="q-head">
          <div>
            <div class="q-stem"><span class="q-no">Q${index + 1}</span> ${esc(q.stem)}</div>
            <div class="q-meta"><span>${q.type === 'single' ? '单选题' : '简答题'}</span><span>·</span><span>得分 ${item.score} / ${q.score}</span>${q.source ? `<span>·</span><span>${esc(q.source)}</span>` : ''}</div>
          </div>
          <span class="badge ${correct ? 'success' : item.score > 0 ? 'warning' : 'danger'}">${correct ? '正确' : item.score > 0 ? '部分得分' : '需订正'}</span>
        </div>
        ${body}
      </div>`;
    }).join('');
    return head + `<div class="practice-layout"><div>${list}</div>
      <div class="card practice-side">
        <div class="card-head"><h2>本次成绩</h2><span class="badge">${paper.result.total} / ${paper.result.max}</span></div>
        <div class="card-body">
          <div class="privacy-note"><span>📊</span><div>正确率 ${Math.round(paper.result.total / paper.result.max * 100)}%。${isHistory ? '这是历史练习回顾。' : '可在「练习历史」中随时回看本次解析。'}</div></div>
          <a class="btn btn-primary btn-block" style="margin-top:14px" href="#/student/practice-self">再来一组</a>
        </div>
      </div></div>`;
  }

  /* 作答中 */
  const questionsHtml = qs.map((q, index) => {
    const value = paper.answers[q.id];
    return `
    <div class="q-card" id="q-${q.id}">
      <div class="q-head">
        <div>
          <div class="q-stem"><span class="q-no">Q${index + 1}</span> ${esc(q.stem)}</div>
          <div class="q-meta"><span>${q.type === 'single' ? '单选题' : '简答题'}</span><span>·</span><span>${q.score} 分</span>${q.source ? `<span>·</span><span>${esc(q.source)}</span>` : ''}<span>·</span><span>${esc(P(q.knowledgeId)?.title || '')}</span></div>
        </div>
      </div>
      ${q.type === 'single'
        ? `${(q.options || []).map((opt, i) => `
          <div class="option ${pickedIndex(value) === i ? 'selected' : ''}" data-act="practice-option" data-id="${q.id}" data-index="${i}">
            <span class="key">${String.fromCharCode(65 + i)}</span><span>${esc(opt)}</span>
          </div>`).join('')}`
        : `<textarea class="textarea" data-act="practice-short" data-id="${q.id}" placeholder="写下你的理解和计算步骤…">${esc(answerText(value) || '')}</textarea>
          ${answerImageBarHtml('practice', q.id, value)}`}
    </div>`;
  }).join('');

  const answeredCount = qs.filter(q => answerHasContent(paper.answers[q.id])).length;

  return head + `
  <div class="practice-layout">
    <div>${questionsHtml}</div>
    <div class="card practice-side">
      <div class="card-head"><h2>答题卡</h2><span class="badge">${answeredCount} / ${qs.length}</span></div>
      <div class="card-body">
        <div class="answer-card">${qs.map((q, i) => `<div class="ans-dot ${answerHasContent(paper.answers[q.id]) ? 'done' : ''}" data-act="jump" data-id="${q.id}">${i + 1}</div>`).join('')}</div>
        <div class="divider"></div>
        <div class="privacy-note"><span>🤖</span><div>提交后立即判分：客观题自动判定，简答题由 AI 按评分要点给出建议分数。</div></div>
        <button class="btn btn-primary btn-block" style="margin-top:14px" data-act="submit-practice">提交并判分</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="exit-practice">放弃本次练习</button>
      </div>
    </div>
  </div>`;
}

function practiceView() {
  /* 学生端只保留「课堂问答」和「课后作业」，课后习题并入课后作业 */
  const mode = ui.practiceTab === 'quiz' ? 'quiz' : 'homework';
  const now = Date.now();
  const courses = studentCourses();

  /* 聚合学生已加入的所有课程 */
  const items = [];
  courses.forEach(c => {
    const data = db.courses[c.courseId];
    if (!data) return;
    data.assignments.filter(a => a.mode === mode).forEach(a => {
      const sub = db.submissions.find(s => s.assignmentId === a.id && s.studentId === 's1');
      const max = a.questionIds.reduce((sum, qid) => sum + ((data.questions.find(q => q.id === qid) || {}).score || 0), 0);
      items.push({
        kind: 'assignment', id: a.id, title: a.title, course: c, sub,
        expired: !sub && isExpired(a),
        meta: `${a.questionIds.length} 题 · ${max} 分${a.note ? ` · ${a.note}` : ''}`,
        dueAt: a.mode === 'homework' ? a.dueAt : null
      });
    });
    if (mode === 'homework') {
      (data.distributed || []).filter(d => d.classId === c.classId).forEach(d => {
        const sub = (db.exerciseSubmissions || []).find(s => s.distId === d.id && s.studentId === 's1');
        items.push({
          kind: 'exercise', id: d.id, title: d.title, course: c, sub,
          expired: !sub && d.dueAt <= now,
          meta: `${d.exerciseIds.length} 题 · ${esc(d.distributedAt)} 下发`,
          dueAt: d.dueAt
        });
      });
    }
  });

  const pending = items.filter(i => !i.sub && !i.expired);
  const expiredItems = items.filter(i => !i.sub && i.expired);
  const done = items.filter(i => !!i.sub);

  const pendingCard = item => `
  <div class="practice-item">
    <div class="practice-item-head">
      <span class="practice-course">${esc(item.course.name)}</span>
      <span class="badge warning">待完成</span>
    </div>
    <div class="practice-item-title">${esc(item.title)}</div>
    <div class="practice-item-meta">${item.meta}</div>
    ${item.dueAt ? `
      <div class="deadline">
        <span>⏰ 截止 ${formatDue(item.dueAt)}</span>
        <span>${remainingText({ dueAt: item.dueAt })}</span>
      </div>` : ''}
    <div class="practice-item-foot">
      <button class="btn btn-sm btn-primary" data-act="start-practice-item" data-kind="${item.kind}" data-id="${item.id}" data-course="${item.course.courseId}">开始作答</button>
      <span class="form-hint" style="margin:0">${esc(item.course.teacher)} · ${esc(item.course.className)}</span>
    </div>
  </div>`;

  const doneCard = item => {
    const active = ui.practiceItem && ui.practiceItem.kind === item.kind && ui.practiceItem.id === item.id;
    const badge = item.kind === 'exercise'
      ? '<span class="badge success">已提交</span>'
      : item.sub.status === 'reviewed'
        ? '<span class="badge success">教师已复核</span>'
        : item.sub.status === 'auto'
          ? '<span class="badge success">自动判分</span>'
          : '<span class="badge ai">AI 已批改</span>';
    return `
    <button class="practice-item is-done ${active ? 'active' : ''}" data-act="open-practice-item" data-kind="${item.kind}" data-id="${item.id}" data-course="${item.course.courseId}">
      <div class="practice-item-head">
        <span class="practice-course">${esc(item.course.name)}</span>
        ${badge}
      </div>
      <div class="practice-item-title">${esc(item.title)}</div>
      <div class="practice-item-meta">${item.meta}</div>
      <div class="practice-score-row">
        ${item.kind === 'assignment'
          ? `<span class="practice-score">${item.sub.total}<small>/${item.sub.max}</small></span>`
          : '<span class="practice-score">已提交<small>待批阅</small></span>'}
        <span class="practice-open">在右侧查看 →</span>
      </div>
    </button>`;
  };

  const expiredCard = item => `
  <div class="practice-item is-expired">
    <div class="practice-item-head">
      <span class="practice-course">${esc(item.course.name)}</span>
      <span class="badge danger">已截止</span>
    </div>
    <div class="practice-item-title">${esc(item.title)}</div>
    <div class="practice-item-meta">${item.meta}</div>
    <div class="practice-item-foot">
      <span class="btn btn-sm" style="opacity:.55;cursor:not-allowed">已截止，无法作答</span>
      <span class="form-hint" style="margin:0">${esc(item.course.teacher)} · ${esc(item.course.className)}</span>
    </div>
  </div>`;

  const listHtml = (pending.length || expiredItems.length || done.length)
    ? `
    <div class="practice-group">
      <div class="practice-group-head"><b>待完成</b><span class="badge warning">${pending.length}</span></div>
      ${pending.length ? pending.map(pendingCard).join('') : '<div class="practice-group-empty">待完成任务已清空</div>'}
      ${expiredItems.length ? `
        <div class="practice-group-head sub"><b>已截止</b><span class="badge danger">${expiredItems.length}</span></div>
        ${expiredItems.map(expiredCard).join('')}` : ''}
    </div>
    <div class="practice-group">
      <div class="practice-group-head"><b>已完成</b><span class="badge success">${done.length}</span><span class="practice-group-hint">写完的自动排到下面</span></div>
      ${done.length ? done.map(doneCard).join('') : '<div class="practice-group-empty">提交后作业会出现在这里，批改结果可在右侧查看</div>'}
    </div>`
    : '<div class="empty"><b>暂无任务</b>老师布置后会按课程聚合显示在这里</div>';

  return `
  <div style="max-width:460px;margin-bottom:16px">
    <div class="tabs">
      <button class="tab ${mode === 'quiz' ? 'active' : ''}" data-act="practice-tab" data-tab="quiz">课堂问答</button>
      <button class="tab ${mode === 'homework' ? 'active' : ''}" data-act="practice-tab" data-tab="homework">课后作业</button>
    </div>
  </div>
  <div class="practice-summary">
    <span class="badge warning">待完成 ${pending.length}</span>
    <span class="badge success">已完成 ${done.length}</span>
    ${expiredItems.length ? `<span class="badge danger">已截止 ${expiredItems.length}</span>` : ''}
    <span class="practice-summary-hint">共 ${items.length} 项 · 覆盖 ${courses.length} 门课程</span>
  </div>

  <div class="practice-board">
    <div class="practice-list">${listHtml}</div>
    ${practiceDetailPanel(done)}
  </div>

  ${mode === 'homework' ? `
  <div class="privacy-note" style="margin-top:12px">
    <span>📘</span>
    <div>作业统一展示，不区分来源；老师会根据教学进度，从教材例题、教材课后习题、AI 出题或自拟题中选择后发放。</div>
  </div>` : ''}`;
}

/* 右侧批改详情：不跳页查看已完成作业 */
function practiceDetailPanel(doneItems) {
  const placeholder = text => `<aside class="practice-detail"><div class="card"><div class="card-body">
    <div class="empty"><b>选择一份已完成的作业</b>${esc(text)}</div>
  </div></div></aside>`;

  if (!doneItems.length) {
    return placeholder('完成并提交作业后，点击左侧「已完成」的作业，批改详情会显示在这里');
  }
  const current = ui.practiceItem
    ? doneItems.find(i => i.kind === ui.practiceItem.kind && i.id === ui.practiceItem.id)
    : null;
  if (!current) {
    return placeholder('点击左侧「已完成」中的任意一项，即可在这里查看得分、标准答案与教师批改，无需跳转页面');
  }

  /* 详情所属课程与当前课程不同时，静默切换，保证题目与批改数据对应 */
  if (current.course.courseId !== db.courseId) {
    const cls = classOfCourseForStudent(current.course.courseId);
    if (cls) {
      useCourse(db, current.course.courseId);
      db.studentClassId = cls.id;
    }
  }

  let body;
  if (current.kind === 'assignment') {
    const assignment = A(current.id);
    const sub = mySubmission(current.id);
    body = assignment && sub ? resultView(assignment, sub) : '<div class="empty">批改结果不存在</div>';
  } else {
    const dist = distributedOf(current.id);
    const sub = myExerciseSubmission(current.id);
    body = dist && sub ? `
      ${dist.exerciseIds.map((eid, index) => {
        const ex = EX(eid);
        if (!ex) return '';
        return `
        <div class="review-card" style="background:var(--surface-2)">
          <div class="review-head"><b>Q${index + 1} · ${esc(ex.title)}</b><span class="badge">教材第 ${ex.page} 页</span></div>
          <div class="review-text">${answerDisplayHtml(sub.answers[eid], '未作答')}</div>
        </div>`;
      }).join('')}
      <div class="privacy-note" style="margin-top:12px">
        <span>⏳</span><div>已于 ${esc(sub.submittedAt)} 提交，等待老师批阅，批改后这里会同步更新。</div>
      </div>` : '<div class="empty">提交记录不存在</div>';
  }

  return `<aside class="practice-detail">
    <div class="card">
      <div class="card-head">
        <div><h2>${esc(current.title)}</h2><div class="sub">${esc(current.course.name)} · ${esc(current.course.teacher)} · ${esc(current.course.className)}</div></div>
        <span class="badge brand">批改详情</span>
      </div>
      <div class="card-body practice-detail-body">${body}</div>
    </div>
  </aside>`;
}

/* ---------------- 错题本 ---------------- */

function wrongBookView() {
  const courses = studentCourses();
  const courseId = currentWrongCourseId();
  const course = courses.find(c => c.courseId === courseId) || null;
  const wrongs = courseId ? studentWrongQuestions(courseId) : [];
  const selected = (ui.wrongSelected || []).filter(qid => wrongs.some(w => w.qid === qid));
  const clearedCount = wrongs.filter(w => redoCleared(courseId, w.qid)).length;
  const pointCount = new Set(wrongs.filter(w => w.point).map(w => w.point.id)).size;
  const pointFilter = ui.wrongPointFilter || '';
  const pointMap = {};
  wrongs.forEach(w => {
    if (w.point) pointMap[w.point.id] = (pointMap[w.point.id] || 0) + 1;
  });
  const pointOptions = Object.entries(pointMap).map(([id, count]) => ({ id, count, title: P(id)?.title || '未关联知识点' }));
  const filteredWrongs = pointFilter ? wrongs.filter(w => w.point && w.point.id === pointFilter) : wrongs;

  const answerText = (q, ans) => {
    if (ans === undefined || ans === null || ans === '') return '未作答';
    if (q.type === 'single') {
      const idx = Number(ans);
      return `${String.fromCharCode(65 + idx)} ${q.options[idx] || ''}`;
    }
    return String(ans);
  };

  const tabs = courses.map(c => `
    <button class="wrong-course ${c.courseId === courseId ? 'active' : ''}" data-act="wrong-course" data-id="${c.courseId}">
      ${esc(c.name)}<span>${wrongCountOfCourse(c.courseId)}</span>
    </button>`).join('');

  const items = filteredWrongs.map(w => {
    const isSel = selected.includes(w.qid);
    const cleared = redoCleared(courseId, w.qid);
    const right = w.question.type === 'single'
      ? `${String.fromCharCode(65 + w.question.answer)} ${w.question.options[w.question.answer]}`
      : (w.question.keywords || []).join('、') || '见课件原文';
    return `
    <div class="wrong-item ${isSel ? 'selected' : ''} ${cleared ? 'cleared' : ''}" data-act="toggle-wrong" data-id="${w.qid}">
      <span class="wrong-tick ${isSel ? 'on' : ''}">${isSel ? '✓' : ''}</span>
      <div class="wrong-item-main">
        <div class="wrong-item-title">${esc(w.question.stem)}</div>
        <div class="wrong-item-meta">
          <span class="badge">${esc(course ? course.name : '')}</span>
          <span>${esc(w.point ? w.point.title : '未关联知识点')}</span><span>·</span>
          <span>课件第 ${w.point ? w.point.page : '-'} 页</span><span>·</span>
          <span>得分 ${w.score} / ${w.max}</span>
        </div>
        <div class="wrong-answer-line">
          <span class="mine">我的答案：${w.question.type === 'single'
            ? (() => { const t = answerText(w.answer).trim(); const l = t === '' ? '未作答' : String.fromCharCode(65 + Number(t)); const ph = answerImages(w.answer).length ? `（附 ${answerImages(w.answer).length} 张照片）` : ''; return l + ph; })()
            : answerDisplayHtml(w.answer, '未作答')}</span>
          <span class="right">正确答案：${esc(right)}</span>
        </div>
        <div class="wrong-diag">错因：${esc((w.question.diagnosis && w.question.diagnosis.reason) || '需要回到课件重新梳理该知识点。')}</div>
      </div>
      <div class="wrong-item-side">
        ${cleared ? '<span class="badge success">已订正</span>' : '<span class="badge warning">待订正</span>'}
        ${w.point ? `<button class="btn btn-sm btn-ghost" data-act="open-point" data-id="${w.point.id}">查看知识点</button>` : ''}
      </div>
    </div>`;
  }).join('');

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-head">
      <div><h2>错题本</h2><div class="sub">做错或失分的题目会自动收录，可勾选同一科目的错题重新做一遍</div></div>
      <span class="badge danger">${wrongs.length} 道待巩固</span>
    </div>
    <div class="card-body">
      <div class="wrong-course-tabs">${tabs || '<span class="form-hint">还没有加入课程</span>'}</div>
      ${wrongs.length ? `<div class="wrong-point-filter">
        <button class="chip-btn ${pointFilter ? '' : 'on'}" data-act="wrong-point-filter" data-id="">全部 ${wrongs.length}</button>
        ${pointOptions.map(opt => `<button class="chip-btn ${pointFilter === opt.id ? 'on' : ''}" data-act="wrong-point-filter" data-id="${opt.id}">${esc(opt.title)} · ${opt.count}</button>`).join('')}

/** 重做结果的标准答案块：原题走完整讲题；变式题无 hints，只给标准答案避免崩溃 */
function redoAnswerBlockHtml(q) {
  if (q && q.isOriginal === false) {
    const point = P(q.knowledgeId);
    const page = point && point.page ? `课件第 ${point.page} 页` : '';
    if (q.type === 'single') {
      const letter = String.fromCharCode(65 + q.answer);
      return `<div class="review-card">
        <div class="review-head"><b>✅ 标准答案</b>${page ? `<span class="badge outline">${page}</span>` : ''}</div>
        <div class="review-text"><div class="std-answer"><span class="std-key">${letter}</span><span>${esc(q.options[q.answer])}</span></div></div>
      </div>`;
    }
    return `<div class="review-card">
      <div class="review-head"><b>✅ 参考答案</b>${page ? `<span class="badge outline">${page}</span>` : ''}</div>
      <div class="review-text">${esc(q.reference || '')}</div>
    </div>`;
  }
  return answerAndStepsHtml(q);
}

function redoView() {
  const redo = ui.redo;
  const courses = studentCourses();
  const course = redo ? courses.find(c => c.courseId === redo.courseId) : null;
  if (!redo || !course || !db.courses[redo.courseId]) {
    return `<div class="empty"><b>没有进行中的错题重做</b>回到错题本勾选题目后开始重做
      <div class="q-actions" style="justify-content:center;margin-top:12px"><a class="btn btn-sm" href="#/student/wrong">返回错题本</a></div>
    </div>`;
  }
  const questions = (redo.questions || []).filter(Boolean);
  const origCount = questions.filter(q => q.isOriginal !== false).length;
  const varCount = questions.length - origCount;

  const head = `
  <div class="page-head">
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <a class="btn btn-sm btn-ghost" href="#/student/wrong" data-act="exit-redo">← 返回错题本</a>
        <span class="badge ai">错题变式重做</span>
      </div>
      <h1>${esc(course.name)} · 错题变式重做</h1>
      <p>共 ${questions.length} 题（${origCount} 道原题 + ${varCount} 道 AI 变式）· 重做不覆盖原成绩，答对原题后错题本标记「已订正」</p>
    </div>
    ${redo.result ? '<span class="badge success">已提交</span>' : ''}
  </div>`;

  if (redo.generating && !redo.result) {
    return head + `
    <div class="empty">
      <div style="font-size:26px;margin-bottom:8px">🤖</div>
      <b>AI 正在举一反三…</b>
      正在为每道错题生成同知识点的变式题，通常需要 10–30 秒，请稍候。
      <div class="form-hint">若未配置大模型，将自动降级为只重做原题。</div>
    </div>`;
  }

  if (redo.result) {
    const rTotal = Number.isFinite(redo.result.total) ? redo.result.total : 0;
    const rMax = Number.isFinite(redo.result.max) ? redo.result.max : 0;
    const percent = rMax ? Math.round((rTotal / rMax) * 100) : 0;
    const origItems = redo.result.items.filter(it => {
      const q = questions.find(qq => qq.id === it.qid);
      return q && q.isOriginal !== false;
    });
    const origFull = origItems.filter(i => i.score >= i.max).length;
    const detail = questions.map((q, index) => {
      const item = redo.result.items.find(i => i.qid === q.id);
      const full = item && item.score >= item.max;
      const isVariant = q.isOriginal === false;
      const badge = isVariant
        ? `<span class="badge ai">AI 变式</span> <span class="badge ${full ? 'success' : 'danger'}">${full ? '答对' : '答错'}</span>`
        : `<span class="badge ${full ? 'success' : 'outline'}">${full ? '原题 · 已订正' : '原题'}</span>`;
      const aiReview = item && item.review
        ? `<div class="review-card"><div class="review-head"><b>🧠 AI 判分${item.review.usedVision ? '（含照片识别）' : ''}</b><span class="badge ${item.review.usedLLM ? 'ai' : 'outline'}">${item.review.usedLLM ? '大模型' : '本地'}评分</span></div><div class="review-text">${esc(item.review.comment || '')}</div></div>${latexReviewHtml(item.review)}`
        : '';
      return `
      <div class="q-card">
        <div class="q-head">
          <div>
            <div class="q-stem"><span class="q-no">Q${index + 1}</span> ${esc(q.stem)}</div>
            <div class="q-meta"><span>得分 ${item ? item.score : 0} / ${q.score}</span><span>·</span><span>${esc(P(q.knowledgeId)?.title || '')}</span></div>
          </div>
          ${badge}
        </div>
        <div class="review-card" style="background:var(--surface-2)"><div class="review-head"><b>我的重做答案</b></div><div class="review-text">${q.type === 'single' ? singleAnswerLineHtml(item ? item.answer : '', q.answer) : answerDisplayHtml(item ? item.answer : '')}</div></div>
        ${aiReview}
        ${redoAnswerBlockHtml(q)}
      </div>`;
    }).join('');

    return head + `
    <div class="result-hero">
      <div class="score-ring" style="--p:${percent}">
        <span><b>${rTotal}</b><small>/ ${rMax}</small></span>
      </div>
      <div style="flex:1">
        <div style="font-size:15px;font-weight:600;margin-bottom:4px">错题变式重做完成</div>
        <div class="review-text">原题答对 ${origFull} / ${origItems.length} 题；答对的原题会在错题本标记为「已订正」，不覆盖原作业成绩。变式题仅用于巩固，不计入订正状态。</div>
      </div>
      <div class="q-actions" style="margin:0">
        <a class="btn btn-sm btn-primary" href="#/student/wrong" data-act="exit-redo">返回错题本</a>
        <a class="btn btn-sm btn-ghost" href="#/student/learn">回到知识导图</a>
      </div>
    </div>
    <div style="margin-top:16px">${detail}</div>`;
  }

  const answeredCount = questions.filter(q => answerHasContent(redo.answers[q.id])).length;

  const cards = questions.map((q, index) => {
    const value = redo.answers[q.id];
    const isVariant = q.isOriginal === false;
    const dispScore = Number.isFinite(q.score) ? q.score : (q.type === 'single' ? 5 : 10);
    return `
    <div class="q-card" id="q-${q.id}">
      <div class="q-head">
        <div>
          <div class="q-stem"><span class="q-no">Q${index + 1}</span> ${esc(q.stem)} <span class="badge ${isVariant ? 'ai' : 'brand'}" style="margin-left:6px">${isVariant ? '🔁 AI 变式 · 举一反三' : '📝 原题'}</span></div>
          <div class="q-meta"><span>${q.type === 'single' ? '单选题' : '简答题'}</span><span>·</span><span>${dispScore} 分</span><span>·</span><span>${esc(P(q.knowledgeId)?.title || '')}</span></div>
        </div>
      </div>
      ${q.type === 'single'
        ? `${q.options.map((opt, i) => `
          <div class="option ${pickedIndex(value) === i ? 'selected' : ''}" data-act="redo-option" data-id="${q.id}" data-index="${i}">
            <span class="key">${String.fromCharCode(65 + i)}</span>
            <span>${esc(opt)}</span>
          </div>`).join('')}
          <div class="answer-images">${answerImageBarHtml('redo', q.id, value, '可附上手写解题过程照片（选填，不影响选项判分）')}</div>`
        : `<textarea class="textarea" data-act="redo-short" data-id="${q.id}" placeholder="重新写下你的答案与步骤…">${esc(answerText(value) || '')}</textarea>
          ${answerImageBarHtml('redo', q.id, redo.answers[q.id])}`}
    </div>`;
  }).join('');

  return head + `
  <div class="practice-layout">
    <div>${cards}</div>
    <div class="card practice-side">
      <div class="card-head"><h2>重做进度</h2><span class="badge">${answeredCount} / ${questions.length}</span></div>
      <div class="card-body">
        <div class="privacy-note"><span>📌</span><div>重做只用于订正与巩固，不修改原作业成绩；变式题不计入订正状态。</div></div>
        <button class="btn btn-primary btn-block" style="margin-top:14px" data-act="submit-redo">提交重做</button>
        <button class="btn btn-ghost btn-block" style="margin-top:8px" data-act="exit-redo">退出重做</button>
      </div>
    </div>
  </div>`;
}

/* 照片作答上传条（作答阶段专用）：缩略图可删除/预览，label 触发相机或文件选择 */
function answerImageBarHtml(kind, qid, value, hint) {
  const u = unwrapAnswer(value);
  const thumbs = u.images.map((src, i) => `
    <span class="ans-thumb-wrap">
      <img class="ans-thumb" src="${src}" alt="作答图片" data-act="preview-image" data-src="${src}">
      <button class="ans-thumb-del" data-act="remove-answer-image" data-kind="${kind}" data-id="${qid}" data-idx="${i}" title="删除">×</button>
    </span>`).join('');
  const canAdd = u.images.length < MAX_ANSWER_IMAGES;
  return `<div class="ans-img-bar">
    ${thumbs}
    <label class="ans-img-add ${canAdd ? '' : 'disabled'}" title="${canAdd ? '拍照或从相册选择（移动端可直接调用相机）' : `最多 ${MAX_ANSWER_IMAGES} 张`}">
      <input type="file" accept="image/*" capture="environment" multiple data-act="answer-file" data-kind="${kind}" data-id="${qid}" ${canAdd ? '' : 'disabled'}>
      📷 拍照 / 上传图片
    </label>
    <span class="form-hint">${hint || `可上传手写过程照片 · 数学/物理公式会自动识别为 LaTeX 并逐步比对 · 最多 ${MAX_ANSWER_IMAGES} 张`}</span>
  </div>`;
}

/* 单选题作答展示：选项字母 + 对错 + 已附照片缩略图（学生结果/重做结果共用） */
function singleAnswerLineHtml(value, answer) {
  const u = unwrapAnswer(value);
  const idx = u.text === '' ? -1 : Number(u.text);
  const ok = idx === answer;
  const letter = idx >= 0 ? String.fromCharCode(65 + idx) : '未选';
  const imgs = u.images.length
    ? `<div class="ans-imgs" style="margin-top:8px">${u.images.map((src, i) => `<span class="ans-thumb-wrap"><img class="ans-thumb" src="${src}" alt="作答图片" data-act="preview-image" data-src="${src}"><span class="ans-thumb-idx">${i + 1}</span></span>`).join('')}</div>`
    : '';
  return `你的答案：<b>${ok ? '✓' : '✗'} ${letter}</b>${u.images.length ? `（附 ${u.images.length} 张照片）` : ''}${imgs}`;
}

/* 单选题已选序号：未作答返回 -1，避免空值被 Number('')===0 误判为选中 A */
function pickedIndex(value) {
  const t = answerText(value).trim();
  return t === '' ? -1 : Number(t);
}

function resultView(assignment, sub) {
  const percent = Math.round((sub.total / sub.max) * 100);
