    const q = Q(qid);
    const score = sub.scores[qid] || 0;
    const correct = score === q.score;
    const wrong = q.type === 'single' && !correct;
    const review = sub.aiReviews?.[qid];
    const teacherReview = sub.teacherReview && q.type === 'short' ? sub.teacherReview : null;

    return `
    <div class="q-card">
      <div class="q-head">
        <div>
          <div class="q-stem"><span class="q-no">Q${index + 1}</span> ${esc(q.stem)}</div>
          <div class="q-meta"><span>${q.type === 'single' ? '单选题' : '简答题'}</span><span>·</span><span>得分 ${score} / ${q.score}</span></div>
        </div>
        <span class="badge ${correct ? 'success' : score > 0 ? 'warning' : 'danger'}">${correct ? '正确' : score > 0 ? '部分得分' : '需订正'}</span>
      </div>

      ${q.type === 'single' ? `${q.options.map((opt, i) => {
        let cls = '';
        if (i === q.answer) cls = 'correct';
        else if (i === pickedIndex(sub.answers[qid])) cls = 'wrong';
        return `<div class="option ${cls}"><span class="key">${String.fromCharCode(65 + i)}</span><span>${esc(opt)}</span></div>`;
      }).join('')}
        <div class="review-card" style="background:var(--surface-2)">
          <div class="review-head"><b>我的答案</b></div>
          <div class="review-text">${singleAnswerLineHtml(sub.answers[qid], q.answer)}</div>
        </div>` : `
        <div class="review-card" style="background:var(--surface-2)">
          <div class="review-head"><b>我的答案</b></div>
          <div class="review-text">${answerDisplayHtml(sub.answers[qid])}</div>
        </div>`}

      ${answerAndStepsHtml(q)}

      ${review ? `
        <div class="review-card ai">
          <div class="review-head"><b>🤖 AI 初评</b><span class="badge ai">${review.score} 分</span>${review.usedLLM ? '<span class="badge" style="margin-left:6px;background:#eef2ff;color:#4f46e5">AI 生成 · 仅供参考</span>' : ''}${review.usedVision ? '<span class="badge" style="margin-left:6px;background:#fff7ed;color:#c2410c">已识别手写照片</span>' : ''}</div>
          <div class="review-text">${esc(review.comment).replace(/\n/g, '<br>')}</div>
          <button class="btn btn-sm btn-ghost" style="margin-top:8px" data-act="open-point" data-id="${q.knowledgeId}">📖 查看课件第 ${P(q.knowledgeId)?.page} 页原文</button>
        </div>
        ${latexReviewHtml(review)}` : ''}

      ${teacherReview ? `
        <div class="review-card teacher">
          <div class="review-head"><b>✅ 教师复核</b><span class="badge success">${teacherReview.score} 分</span></div>
          <div class="review-text">${esc(teacherReview.comment)}</div>
        </div>` : (q.type === 'short' ? `
        <div class="review-card">
          <div class="review-head"><b>等待教师复核</b><span class="badge warning">待确认</span></div>
          <div class="review-text">AI 评分仅供参考，教师确认后成绩为最终结果。</div>
        </div>` : '')}

      ${wrong || (q.type === 'short' && score < q.score * 0.6) ? diagnosisHtml(q) : ''}

      <div class="q-actions">
        <button class="btn btn-sm btn-ai" data-act="open-tutor" data-id="${q.id}">🤖 继续追问 AI</button>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="result-hero">
    <div class="score-ring" style="--p:${percent}">
      <span><b>${sub.total}</b><small>/ ${sub.max}</small></span>
    </div>
    <div style="flex:1">
      <div style="font-size:15px;font-weight:600;margin-bottom:4px">本次任务已完成</div>
      <div class="review-text">客观题已即时判分。${sub.status === 'reviewed' ? '教师已完成复核，成绩为最终结果。' : sub.status === 'auto' ? '本任务全部为客观题，无需教师复核。' : '简答题由 AI 给出建议分数，教师复核后成绩会更新。'}</div>
    </div>
    <div style="text-align:right">
      <div class="badge ${sub.status === 'reviewed' || sub.status === 'auto' ? 'success' : 'ai'}">${sub.status === 'reviewed' ? '教师已复核' : sub.status === 'auto' ? '自动判分' : 'AI 初评待复核'}</div>
      <div class="form-hint">提交于 ${esc(sub.submittedAt)}</div>
    </div>
  </div>

  <div style="margin-top:16px">${questionsHtml}</div>

  <div class="card" style="margin-top:16px">
    <div class="card-head"><h2>这次作业说明了什么</h2><span class="badge ai">AI 诊断</span></div>
    <div class="card-body">
      <div class="review-text">
        本次共 ${assignment.questionIds.length} 题，答对 ${assignment.questionIds.filter(qid => sub.scores[qid] === Q(qid).score).length} 题。
        建议优先复习${weakestPointTitle(sub)}；错题已自动收录到错题本，建议在 24 小时内重做一次。
      </div>
      <div class="q-actions">
        <a class="btn btn-sm btn-primary" href="#/student/wrong">去错题本重做</a>
        <a class="btn btn-sm" href="#/student/learn">回到知识导图</a>
        <a class="btn btn-sm" href="#/student/messages">把问题匿名分享给全班</a>
      </div>
    </div>
  </div>`;
}

function answerAndStepsHtml(q) {
  const point = P(q.knowledgeId);
  const solution = mockAi.solutionSteps(q);
  const letter = String.fromCharCode(65 + q.answer);
  const standard = q.type === 'single'
    ? `<div class="std-answer"><span class="std-key">${letter}</span><span>${esc(q.options[q.answer])}</span></div>`
    : `<div class="std-answer"><span class="std-key">要点</span><span>${esc((q.keywords || []).join('、'))}</span></div>`;

  return `
  <div class="review-card">
    <div class="review-head"><b>✅ 标准答案</b><span class="badge outline">课件第 ${point.page} 页</span></div>
    <div class="review-text">${standard}</div>
  </div>
  <div class="review-card ai">
    <div class="review-head"><b>🧭 AI 讲题步骤</b><span class="badge ai">${solution.steps.length} 步</span></div>
    <ol class="step-list">
      ${solution.steps.map(step => `<li>${esc(step)}</li>`).join('')}
    </ol>
    <div class="form-hint">${esc(solution.cite)}</div>
  </div>`;
}

function weakestPointTitle(sub) {
  let worst = null;
  Object.entries(sub.scores).forEach(([qid, score]) => {
    const q = Q(qid);
    if (!q) return;
    const rate = score / q.score;
    if (!worst || rate < worst.rate) worst = { rate, title: P(q.knowledgeId)?.title || '' };
  });
  return worst ? `「${worst.title}」` : '基础知识点';
}

function diagnosisHtml(q) {
  const d = mockAi.diagnose(q);
  return `
  <div class="diagnosis">
    <h4>🔍 错题诊断 · ${esc(d.pointTitle)}</h4>
    <div class="diag-row"><b>课件原文：</b>${esc(d.excerpt || '')}（第 ${d.page} 页）</div>
    <div class="diag-row"><b>错因：</b>${esc(d.reason)}</div>
    <div class="diag-row"><b>复习建议：</b>${esc(d.advice)}</div>
    <div class="diag-row"><b>相似练习：</b>${esc(d.similar)}</div>
    <div class="q-actions">
      <button class="btn btn-sm" data-act="open-point" data-id="${q.knowledgeId}">查看对应知识点（第 ${d.page} 页）</button>
    </div>
  </div>`;
}

function messagesView() {
  const courseMessages = db.messages.filter(m => m.courseId === db.courseId && m.classId === db.studentClassId);
  const myMessages = courseMessages.filter(m => m.authorId === 's1');
  const publicMessages = courseMessages.filter(m => m.visibility === 'public');
  const questionOptions = db.questions.map((q, i) =>
    `<option value="${q.id}">Q${i + 1} · ${esc(q.stem.slice(0, 22))}…</option>`).join('');
  const courseTeachers = teachersOfCourse(db.courseId);
  const teacherOptions = courseTeachers.map((t, i) =>
    `<option value="${t.id}">${esc(t.name)}${i === 0 ? '（主讲）' : ''}</option>`).join('');

  const myHtml = myMessages.map(m => messageCard(m, false)).join('');
  const publicHtml = publicMessages.map(m => messageCard(m, true)).join('');

  return `
  <div class="notice">
    <span>🔒</span>
    <div><b>匿名说明：</b>勾选「匿名公开」后，问题会出现在课程问答广场，其他同学只能看到「匿名同学」；不勾选则只有你和任课老师可见。可在下方选择请教哪位老师，该课程的任课老师都能看到并回答。</div>
  </div>

  <div class="grid-2" style="grid-template-columns:1fr 1fr;align-items:start">
    <div class="card">
      <div class="card-head"><h2>向任课老师提问</h2><span class="badge brand">私信</span></div>
      <div class="card-body">
        <div class="field">
          <label>请教哪位老师</label>
          <select class="select" id="msg-teacher">
            ${teacherOptions || '<option value="">（暂无老师）</option>'}
          </select>
        </div>
        <div class="field">
          <label>问题内容</label>
          <textarea class="textarea" id="msg-body" placeholder="例如：老师，MSE 里为什么一定要平方，取绝对值不行吗？">${esc(ui.prefillMessage || '')}</textarea>
        </div>
        <div class="field">
          <label>关联题目（选填）</label>
          <select class="select" id="msg-question">
            <option value="">不关联题目</option>
            ${questionOptions}
          </select>
        </div>
        <label class="check" style="margin-bottom:14px">
          <input type="checkbox" id="msg-anon">
          <span>匿名公开到课程问答广场<br><span class="form-hint" style="margin:0">公开后全班可见问题与老师回答，但不显示你的姓名、头像和学号</span></span>
        </label>
        <button class="btn btn-primary btn-block" data-act="send-message">发送问题</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>我的提问</h2><span class="badge">${myMessages.length} 条</span></div>
      <div class="card-body">
        ${myHtml ? `<div class="msg-list">${myHtml}</div>` : '<div class="empty"><b>还没有提问</b>左侧输入问题即可发送给老师</div>'}
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-head">
      <div><h2>课程问答广场</h2><div class="sub">本课程同学匿名公开的问题，老师回答后全班可见</div></div>
      <span class="badge ai">${publicMessages.length} 个问题</span>
    </div>
    <div class="card-body">
      ${publicHtml ? `<div class="msg-list">${publicHtml}</div>` : '<div class="empty"><b>暂无公开问答</b>你可以把典型问题匿名分享到这里</div>'}
    </div>
  </div>`;
}

function messageCard(m, asPublic) {
  const pending = !m.answer;
  const author = asPublic ? '匿名同学' : (m.authorName === '李同学' ? '我' : m.authorName);
  const teacherName = m.answeredBy || m.addressedToName || db.course.teacher;
  return `
  <div class="msg">
    <div class="msg-head">
      <span class="avatar ${asPublic ? 'anon' : ''}">${asPublic ? '匿' : esc(author.slice(0, 1))}</span>
      <span class="msg-author">${esc(author)}</span>
      ${asPublic ? '<span class="badge">匿名公开</span>' : `<span class="badge ${m.anonymous ? 'ai' : 'brand'}">${m.anonymous ? '已匿名公开' : '仅双方可见'}</span>`}
      ${m.addressedToName ? `<span class="badge">请教 ${esc(m.addressedToName)}</span>` : ''}
      <span class="badge ${pending ? 'warning' : 'success'}">${pending ? '待回答' : '老师已回答'}</span>
      <span class="msg-time">${esc(m.createdAt)}</span>
    </div>
    <div class="msg-body">${esc(m.body)}</div>
    ${m.questionId ? `<div class="msg-link">关联题目 · Q${db.questions.findIndex(q => q.id === m.questionId) + 1}</div>` : ''}
    ${m.answer
      ? `<div class="answer"><b>${esc(teacherName)}的回答</b>${esc(m.answer)}</div>`
      : '<div class="answer pending"><b>等待老师回答</b>老师回复后这里会同步显示</div>'}
  </div>`;
}

</script>
<script>
/* ===== js/app.js ===== */
/* ============================================================
 * 路由、渲染、事件绑定
 * ============================================================ */

const root = document.getElementById('app');
let liveTimer = null;
let practiceTimer = null;
let countdownTimer = null;

function parseHash() {
  const raw = (location.hash || '#/login').replace(/^#\/?/, '');
  return raw.split('/').filter(Boolean);
}

function render() {
  const parts = parseHash();
  if (liveTimer) {
    clearInterval(liveTimer);
    liveTimer = null;
  }

  if (!parts.length || parts[0] === 'login') {
    root.innerHTML = loginView();
    return;
  }

  const role = parts[0];
  const page = parts[1] || (role === 'teacher' ? 'studio' : 'learn');
  const param = parts[2] || '';

  if (!db.session.role || db.session.role !== role) {
    location.hash = db.session.role ? `#/${db.session.role}/${db.session.role === 'teacher' ? 'studio' : 'learn'}` : '#/login';
    return;
  }

  if (role === 'student' && !studentClassIds().length && page !== 'join' && page !== 'practice-self' && page !== 'practice-play') {
    location.hash = '#/student/join';
    return;
  }

  let content = '';
  let pageKey = `${role}/${page}`;

  if (role === 'teacher') {
    if (page === 'studio') content = studioView();
    else if (page === 'live') content = liveView();
    else if (page === 'review') content = reviewView();
    else if (page === 'exam') content = examView();
    else if (page === 'textbook') content = textbookView();
    else if (page === 'classes') content = classesView();
    else if (page === 'qa') content = qaView();
    else if (page === 'analytics') content = analyticsView();
    else { location.hash = '#/teacher/studio'; return; }
  } else {
    if (page === 'learn') content = learnView();
    else if (page === 'practice') content = param ? playerView(param) : practiceView();
    else if (page === 'practice-self') content = practiceSelfView();
    else if (page === 'practice-play') content = practicePlayView();
    else if (page === 'exercise') content = param ? exercisePlayerView(param) : practiceView();
    else if (page === 'messages') content = messagesView();
    else if (page === 'ai') content = aiChatView();
    else if (page === 'wrong') content = wrongBookView();
    else if (page === 'redo') content = redoView();
    else if (page === 'join') content = joinView();
    else { location.hash = '#/student/learn'; return; }
  }

  if (page === 'practice' && param) {
    pageKey = 'student/practice';
  }
  if (page === 'exercise') {
    pageKey = 'student/exercise';
  }
  if (page === 'redo') {
    pageKey = 'student/wrong';
  }
  if (page === 'practice-self' || page === 'practice-play') {
    pageKey = 'student/practice-self';
  }

  root.innerHTML = shellView(pageKey, content);

  if (ui.gen) {
    const input = document.getElementById('ppt-input');
    if (input) input.value = '';
  }
  if (ui.examGen) {
    const input = document.getElementById('exam-input');
    if (input) input.value = '';
  }

  /* 学生作业页：每分钟刷新一次，保证倒计时与提交状态及时更新 */
  if (db.session.role === 'student' && page === 'practice') {
    if (practiceTimer) clearInterval(practiceTimer);
    practiceTimer = setInterval(() => {
      if (location.hash !== '#/student/practice') return;
      const top = window.scrollY;
      render();
      window.scrollTo(0, top);
    }, 60000);
  }

  /* 课堂问答：每秒刷新倒计时，归零自动交卷判分（刷新不重置） */
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  if (db.session.role === 'student' && page === 'practice' && param) {
    const a = A(param);
    if (a && a.mode === 'quiz' && !mySubmission(param) && quizRemaining(a) !== null) {
      const tick = () => {
        const cur = A(param);
        if (!cur) return;
        if (mySubmission(param)) {
          if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
          return;
        }
        const r = quizRemaining(cur);
        const el = document.getElementById('quiz-countdown');
        const txt = el && el.querySelector('.qt-text');
        if (txt && r !== null) txt.textContent = formatClock(r);
        if (el) el.classList.toggle('urgent', r !== null && r <= 30);
        if (r !== null && r <= 0) {
          if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
          submitAssignment(param, { auto: true });
        }
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }
  }

  /* 课上问答页：定时从本地存储刷新，保证正答率及时更新 */
  if (db.session.role === 'teacher' && page === 'live') {
    liveTimer = setInterval(() => {
      if (!location.hash.startsWith('#/teacher/live')) return;
      const top = window.scrollY;
      db = loadDb();
      render();
      window.scrollTo(0, top);
    }, 4000);
  }
}

/* ---------------- 事件委托 ---------------- */

/* 思维导图缩放：直接改 DOM，避免 render 重建丢失滚动位置 */
function applyMindmapZoom(newScale) {
  ui.mmScale = Math.max(0.4, Math.min(3, Number(newScale) || 1));
  const scroll = document.querySelector('.mindmap-scroll');
  if (!scroll) return;
  const stage = scroll.querySelector('.mm-stage');
  const canvas = scroll.querySelector('.mindmap-canvas');
  if (!canvas) return;
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  canvas.style.transform = `scale(${ui.mmScale})`;
  if (stage) {
    stage.style.width = Math.ceil(w * ui.mmScale) + 'px';
    stage.style.height = Math.ceil(h * ui.mmScale) + 'px';
  }
  const label = document.querySelector('.mm-zoom-label');
  if (label) label.textContent = Math.round(ui.mmScale * 100) + '%';
}

/* Ctrl/⌘ + 滚轮以指针为中心缩放导图；普通滚轮仍用于滚动 */
document.addEventListener('wheel', event => {
  if (!event.ctrlKey && !event.metaKey) return;
  const scroll = event.target.closest('.mindmap-scroll');
  if (!scroll) return;
  const canvas = scroll.querySelector('.mindmap-canvas');
  if (!canvas) return;
  event.preventDefault();
  const rect = scroll.getBoundingClientRect();
  const stage = scroll.querySelector('.mm-stage');
  const oldScale = Number(ui.mmScale) || 1;
  const mx = event.clientX - rect.left + scroll.scrollLeft;
  const my = event.clientY - rect.top + scroll.scrollTop;
  const factor = event.deltaY < 0 ? 1.1 : 1 / 1.1;
  const newScale = Math.max(0.4, Math.min(3, +(oldScale * factor).toFixed(3)));
  if (newScale === oldScale) return;
  ui.mmScale = newScale;
  const w = canvas.offsetWidth;
  const h = canvas.offsetHeight;
  canvas.style.transform = `scale(${newScale})`;
  if (stage) {
    stage.style.width = Math.ceil(w * newScale) + 'px';
    stage.style.height = Math.ceil(h * newScale) + 'px';
  }
  const ratio = newScale / oldScale;
  scroll.scrollLeft = mx * ratio - (event.clientX - rect.left);
  scroll.scrollTop = my * ratio - (event.clientY - rect.top);
  const label = document.querySelector('.mm-zoom-label');
  if (label) label.textContent = Math.round(newScale * 100) + '%';
}, { passive: false });

document.addEventListener('click', event => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const act = target.dataset.act;
  const id = target.dataset.id;

  switch (act) {
    case 'logout':
      logout();
      break;
    case 'create-class':
      createClass();
      break;
    case 'switch-class':
      switchClass(id);
      break;
    case 'reset-demo':
      resetDemo();
      break;
    case 'open-scan':
      openScan();
      break;
    case 'close-scan':
      closeScan();
      break;
    case 'scan-manual':
      scanToManual();
      break;
    case 'open-create-course':
      openCreateCourse();
      break;
    case 'close-create-course':
      closeCreateCourse();
      break;
    case 'create-course':
      createCourse();
      break;

    case 'switch-student-course':
      switchStudentCourse(id);
      break;
    case 'open-practice-item':
      openPracticeItem(target.dataset.kind, id, target.dataset.course);
      break;
    case 'start-practice-item':
      startPracticeItem(target.dataset.kind, id, target.dataset.course);
      break;

    case 'wrong-course':
      switchWrongCourse(id);
      break;
    case 'toggle-wrong':
      toggleWrongSelection(id);
      break;
    case 'select-all-wrong':
      selectAllWrongQuestions();
      break;
    case 'clear-wrong':
      clearWrongSelection();
      break;
    case 'start-redo':
      startWrongRedo();
      break;
    case 'redo-option':
      setRedoOption(id, Number(target.dataset.index));
      break;
    case 'submit-redo':
      submitRedo();
      break;
    case 'exit-redo':
      exitRedo();
      break;

    case 'select-chapter': {
      const chapter = chapterOf(id);
      ui.chapterId = id;
      ui.sectionId = chapter.sections[0].id;
      render();
      break;
    }
    case 'select-section':
      ui.sectionId = id;
      render();
      break;
    case 'toggle-node': {
      ui.mmCollapsed = ui.mmCollapsed || {};
      if (ui.mmCollapsed[id]) delete ui.mmCollapsed[id];
      else ui.mmCollapsed[id] = true;
      render();
      break;
    }
    case 'toggle-mm-edit':
      ui.mmEdit = !ui.mmEdit;
      ui.editingNode = null;
      render();
      break;
    case 'mm-zoom': {
      const dir = target.dataset.dir;
      let s = Number(ui.mmScale) || 1;
      if (dir === 'in') s = Math.min(3, +(s * 1.2).toFixed(3));
      else if (dir === 'out') s = Math.max(0.4, +(s / 1.2).toFixed(3));
      else s = 1;
      applyMindmapZoom(s);
      if (dir === 'reset') {
        const sc = document.querySelector('.mindmap-scroll');
        if (sc) { sc.scrollLeft = 0; sc.scrollTop = 0; }
      }
      break;
    }
    case 'edit-mm-node':
      ui.editingNode = { type: target.dataset.type, id: target.dataset.id };
      render();
      break;
    case 'add-mm-node':
      ui.editingNode = { type: target.dataset.type, parentId: target.dataset.parent };
      render();
      break;
    case 'close-mm-modal':
      ui.editingNode = null;
      render();
      break;
    case 'save-mm-node':
      saveMindmapNode();
      break;
    case 'open-point':
      ui.drawerPointId = id;
      render();
      break;
    case 'close-drawer':
      ui.drawerPointId = null;
      render();
      break;

    case 'ask-from-point': {
      const point = P(id);
      ui.drawerPointId = null;
      ui.prefillMessage = point
        ? `老师，我对「${point.title}」这部分还不太理解，能再讲讲吗？（课件第 ${point.page} 页）`
        : '';
      location.hash = '#/student/messages';
      render();
      break;
    }

    case 'open-upload':
      document.getElementById('ppt-input')?.click();
      break;
    case 'open-exam-upload':
      document.getElementById('exam-input')?.click();
      break;
    case 'open-exam':
      openExam(id);
      break;
    case 'confirm-exam':
      confirmExam();
      break;
    case 'batch-objective':
      batchObjective(target.dataset.mode);
      break;
    case 'tb-tab':
      ui.tbTab = target.dataset.tab;
      render();
      break;
    case 'toggle-ex-select':
      toggleExerciseSelect(id);
      break;
    case 'ex-group':
      toggleExerciseGroup(id);
      break;
    case 'ex-difficulty':
      toggleExerciseDifficulty(target.dataset.level);
      break;
    case 'clear-ex':
      clearExerciseSelection();
      break;
    case 'smart-recommend-ex':
      applyRecommendedExercises();
      break;
    case 'select-all-ex':
      selectAllExercises();
      break;
    case 'distribute-exercises':
      distributeExercises();
      break;
    case 'toggle-ex-target':
      toggleExTarget(id);
      break;
    case 'toggle-review-point':
      toggleReviewPoint(id);
      break;
    case 'remove-review-point':
      removeReviewPoint(id);
      break;
    case 'clear-review-list':
      clearReviewList();
      break;
    case 'open-review-point':
      openReviewPoint(id);
      break;
    case 'close-review-point':
      closeReviewPoint();
      break;
    case 'wrong-point-filter':
      ui.wrongPointFilter = id || '';
      render();
      break;
    case 'submit-exercise':
      submitExercise(id);
      break;
    case 'demo-generate':
      runGeneration('机器学习基础（新）.pptx');
      break;

    case 'edit-question':
      openQuestionEditor(id);
      break;
    case 'save-question': {
      const form = document.getElementById('question-form');
      if (!form) break;
      const data = {
        qid: form.dataset.qid,
        stem: form.querySelector('[name="stem"]').value.trim(),
        score: form.querySelector('[name="score"]').value,
        answer: form.querySelector('[name="answer"]:checked')?.value
      };
      const q = Q(data.qid);
      if (q.type === 'single') {
        data.options = q.options.map((_, i) => form.querySelector(`[name="option-${i}"]`).value.trim());
        if (data.answer === undefined) {
          toast('请选择正确答案');
          break;
        }
      }
      if (!data.stem) {
        toast('题干不能为空');
        break;
      }
      saveQuestionEditor(data);
      break;
    }
    case 'close-modal':
      closeQuestionEditor();
      break;

    case 'publish':
      publishQuestion(id, target.dataset.mode);
      break;

    case 'preview-question':
      openTutor(id);
      break;

    case 'practice-tab':
      ui.practiceTab = target.dataset.tab;
      ui.practiceItem = null;
      render();
      break;
    case 'learn-tab':
      switchLearnTab(target.dataset.tab);
      break;
    case 'self-check-set':
      setSelfCheck(target.dataset.point, target.dataset.status);
      break;
    case 'self-check-filter':
      setSelfCheckFilter(target.dataset.filter);
      break;
    case 'self-check-reset':
      resetSelfCheck();
      break;
    case 'ppt-page':
      gotoPptPage(target.dataset.page);
      break;
    case 'ai-section':
      setAiSection(target.dataset.id);
      break;
    case 'ai-chapter':
      setAiChapter(target.dataset.id);
      break;
    case 'open-courseware':
      openCoursewareAt(target.dataset.page);
      break;
    case 'teacher-ppt-preview':
      openTeacherPpt();
      break;
    case 'teacher-ppt-page':
      gotoTeacherPptPage(target.dataset.page);
      break;
    case 'close-teacher-ppt':
      closeTeacherPpt();
      break;

    /* 幻灯片原图浏览 */
    case 'open-slide-deck':
      ui.slideDeck = { id: target.dataset.id || db.courseId, page: Number(target.dataset.page) || 1 };
      render();
      break;
    case 'close-slide-deck':
      ui.slideDeck = null;
      render();
      break;
    case 'slide-deck-page': {
      if (ui.slideDeck) { ui.slideDeck.page = Number(target.dataset.page) || 1; render(); }
      break;
    }
    case 'slide-deck-prev': {
      if (ui.slideDeck) { ui.slideDeck.page = Math.max(1, (ui.slideDeck.page || 1) - 1); render(); }
      break;
    }
    case 'slide-deck-next': {
      if (ui.slideDeck) {
        const d = SLIDE_DECKS[ui.slideDeck.id];
        const t = d ? d.count : 1;
        ui.slideDeck.page = Math.min(t, (ui.slideDeck.page || 1) + 1);
        render();
      }
      break;
    }
    case 'slide-deck-fullscreen': {
      const stage = document.getElementById('sd-stage');
      if (stage) {
        if (!document.fullscreenElement) stage.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
      break;
    }

    case 'save-point-pages':
      savePointPages();
      break;
    case 'qa-tab':
      ui.qaTab = target.dataset.tab;
      ui.activeMessageId = null;
      ui.activeAiQuestionId = null;
      render();
      break;

    case 'open-ai-question':
      openAiQuestion(id);
      break;
    case 'toggle-ai-reviewed':
      toggleAiReviewed(id);
      break;
    case 'ai-home-send':
      sendAiHome();
      break;
    case 'ai-suggest':
      askAiHome(target.dataset.text);
      break;
    case 'ai-home-mode':
      setAiHomeMode(target.dataset.mode);
      break;
    case 'ai-home-hint':
      askHint(Number(target.dataset.level), ui.aiHomeQuestionId);
      break;
    case 'ai-home-tutor-send':
      sendAiHomeTutor();
      break;

    /* AI 模型设置 */
    case 'open-llm-settings':
      openLlmSettings();
      break;
    case 'close-llm-settings':
      closeLlmSettings();
      break;
    case 'llm-preset':
      applyLlmPreset(target.dataset.key);
      break;
    case 'llm-toggle-key':
      toggleLlmKeyVisibility();
      break;
    case 'llm-save':
      saveLlmSettings();
      break;
    case 'llm-clear':
      clearLlmSettingsAction();
      break;
    case 'llm-test':
      testLlmConnection();
      break;
    case 'llm-vision-test':
      testLlmVisionConnection();
      break;

    case 'start-assignment':
      startAssignment(id);
      break;
    case 'ask-assignment': {
      const assignment = A(id);
      if (assignment && assignment.questionIds.length) openTutor(assignment.questionIds[0]);
      break;
    }

    case 'select-option': {
      const qid = id;
      const index = Number(target.dataset.index);
      selectOption(qid, index);
      break;
    }

    case 'remove-answer-image':
      removeAnswerImage(target.dataset.kind, id, target.dataset.idx);
      break;
    case 'preview-image':
      openPreviewImage(target.dataset.src);
      break;
    case 'close-preview':
      closePreviewImage();
      break;

    case 'jump': {
      const el = document.getElementById(`q-${id}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      break;
    }

    case 'submit-assignment':
      submitAssignment(id);
      break;

    /* 自主练习 */
    case 'practice-course':
      ui.practiceCourse = id; ui.practicePoint = ''; render(); break;
    case 'practice-point':
      ui.practicePoint = id; render(); break;
    case 'practice-difficulty':
      ui.practiceDifficulty = target.dataset.level || ''; render(); break;
    case 'practice-build-exam':
      buildPracticeExam(); break;
    case 'practice-build-ai':
      buildPracticeAi(); break;
    case 'practice-option':
      setPracticeOption(id, Number(target.dataset.index)); break;
    case 'submit-practice':
      submitPractice(); break;
    case 'open-practice-record':
      openPracticeRecord(id); break;
    case 'exit-practice':
      exitPractice(); break;

    case 'open-tutor':
      openTutor(id);
      break;
    case 'open-point-from-tutor':
      ui.tutorQuestionId = null;
      ui.drawerPointId = id;
      render();
      break;
    case 'close-tutor':
      closeTutor();
      break;
    case 'ai-hint':
      askHint(Number(target.dataset.level));
      break;
    case 'tutor-send': {
      const input = document.getElementById('tutor-input');
      if (!input) break;
      const text = input.value.trim();
      if (!text) break;
      askTutor(text);
      break;
    }

    case 'open-review':
      openReview(id);
      break;
    case 'review-filter':
      ui.reviewFilter = target.dataset.tab;
      render();
      break;
    case 'batch-adopt-reviews':
      batchAdoptReviews();
      break;
    case 'quick-score':
      quickScore(target.dataset.score);
      break;
    case 'quick-comment':
      quickComment(target.dataset.text);
      break;
    case 'save-review': {
      const scoreInput = document.getElementById('review-score');
      const commentInput = document.getElementById('review-comment');
      if (!scoreInput || !commentInput || !ui.reviewDraft) break;
      ui.reviewDraft.score = scoreInput.value;
      ui.reviewDraft.comment = commentInput.value;
      saveReview();
      break;
    }

    case 'open-message':
      openMessage(id);
      break;
    case 'send-reply': {
      const input = document.getElementById('reply-input');
      if (!input) break;
      sendReply(id, input.value);
      break;
    }
    case 'reopen-reply': {
      const message = db.messages.find(m => m.id === id);
      if (message) {
        message.answer = null;
        message.answeredBy = null;
        saveDb();
        render();
      }
      break;
    }
    case 'send-message': {
      const body = document.getElementById('msg-body');
      const question = document.getElementById('msg-question');
      const anon = document.getElementById('msg-anon');
      const teacher = document.getElementById('msg-teacher');
      if (!body) break;
      sendMessage({
        body: body.value,
        questionId: question ? question.value : '',
        anonymous: !!(anon && anon.checked),
        addressedTo: teacher ? teacher.value : ''
      });
      break;
    }

    default:
      break;
  }
});

/* 主观题输入：保存但不重绘，避免丢失焦点 */
document.addEventListener('input', event => {
  const el = event.target;
  if (el.dataset && el.dataset.act === 'redo-short' && el.dataset.id) {
    setRedoShort(el.dataset.id, el.value);
  }
  if (el.dataset && el.dataset.act === 'short-input' && el.dataset.id) {
    setShortAnswer(el.dataset.id, el.value);
    const assignmentId = parseHash()[2];
    const assignment = A(assignmentId);
    if (assignment) {
      const count = assignment.questionIds.filter(answered).length;
      const badge = document.querySelector('.card-head .badge');
      if (badge) badge.textContent = `${count} / ${assignment.questionIds.length}`;
      assignment.questionIds.forEach((qid, index) => {
        const dot = document.querySelectorAll('.ans-dot')[index];
        if (dot) dot.classList.toggle('done', answered(qid));
      });
    }
  }
  if (el.dataset && el.dataset.act === 'ex-short-input' && el.dataset.id) {
    if (!ui.exerciseDraft) ui.exerciseDraft = {};
    const exId = el.dataset.id;
    const cur = ui.exerciseDraft[exId];
    ui.exerciseDraft[exId] = (cur && typeof cur === 'object')
      ? { text: el.value, images: cur.images || [] }
      : { text: el.value, images: [] };
  }
  if (el.dataset && el.dataset.act === 'practice-short' && el.dataset.id) {
    setPracticeShort(el.dataset.id, el.value);
  }
});

/* 照片作答：文件选择后压缩入库，不重绘以保留输入焦点 */
document.addEventListener('change', event => {
  const el = event.target;
  if (el.id === 'practice-count') {
    const v = Math.max(1, Math.min(10, Number(el.value) || 5));
    ui.practiceCount = v;
    el.value = v;
    return;
  }
  if (el.dataset && el.dataset.act === 'answer-file' && el.files && el.files.length) {
    handleAnswerFiles(el.files, el.dataset.kind, el.dataset.id);
    el.value = '';
  }
});

/* 回车发送 AI 追问 */
document.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.id === 'tutor-input') {
    event.preventDefault();
    const text = event.target.value.trim();
    if (text) askTutor(text);
  }
  if (event.key === 'Enter' && event.target.id === 'ai-home-input') {
    event.preventDefault();
    sendAiHome();
  }
  if (event.key === 'Enter' && event.target.id === 'ai-home-tutor-input') {
    event.preventDefault();
    sendAiHomeTutor();
  }
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey) && event.target.id === 'reply-input') {
    event.preventDefault();
    sendReply(ui.activeMessageId, event.target.value);
  }
});

/* 课件文件选择 */
document.addEventListener('change', event => {
  if (event.target.id === 'ai-page-select') {
    setAiPage(event.target.value);
    return;
  }
  if (event.target.id === 'ai-home-question-select') {
    setAiHomeQuestion(event.target.value);
    return;
  }
  if (event.target.id === 'ppt-input') {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    runGeneration(file.name);
  }
  if (event.target.id === 'exam-input') {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    runExamAnnotation(file.name);
  }
  if (event.target.id === 'class-switch') {
    switchClass(event.target.value);
  }
  if (event.target.id === 'course-switch') {
    switchCourse(event.target.value);
  }
  if (event.target.id === 'student-course-switch') {
    switchStudentCourse(event.target.value);
  }
});

/* 登录表单提交 */
document.addEventListener('submit', event => {
  if (event.target.id === 'join-form') {
    event.preventDefault();
    submitJoinForm();
    return;
  }
  if (event.target.id !== 'login-form') return;
  event.preventDefault();
  const user = document.getElementById('login-user');
  const pass = document.getElementById('login-pass');
  doLogin(user ? user.value : '', pass ? pass.value : '');
});

window.addEventListener('hashchange', render);

/* 其他标签页提交后，课上问答立即刷新 */
window.addEventListener('storage', event => {
  if (event.key !== STORAGE_KEY) return;
  if (!location.hash.startsWith('#/teacher/live')) return;
  db = loadDb();
  render();
});

/* 每次打开或刷新页面都回到登录页，必须重新输入账号密码 */
db.session.role = null;
db.session.userId = null;
saveDb();
const joinQuery = new URLSearchParams(location.search).get('join');
if (joinQuery) ui.pendingJoin = joinQuery.trim();
history.replaceState(null, '', '#/login');
render();

</script>
</body>
</html>
